<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depth not found — Dhruv Garg</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
    <style>
        :root {
            --paper: oklch(94% 0.018 82);
            --ink: oklch(24% 0.044 248);
            --ink-soft: oklch(24% 0.044 248 / 0.72);
            --survey: oklch(58% 0.18 42);
            --panel: oklch(96% 0.014 82 / 0.72);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            font-family: "Atkinson Hyperlegible", system-ui, sans-serif;
            background-color: var(--paper);
            background-image:
                linear-gradient(90deg, oklch(24% 0.044 248 / 0.035) 1px, transparent 1px),
                linear-gradient(0deg, oklch(24% 0.044 248 / 0.03) 1px, transparent 1px);
            background-size: 72px 72px;
            color: var(--ink);
            text-align: center;
        }
        main {
            max-width: 34rem;
            padding: 2rem;
            border: 1px solid oklch(24% 0.044 248 / 0.1);
            border-radius: 6px;
            background: var(--panel);
            box-shadow: 0 20px 62px oklch(24% 0.044 248 / 0.1);
        }
        .eyebrow {
            font-family: "JetBrains Mono", ui-monospace, monospace;
            font-size: 0.62rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: oklch(24% 0.044 248 / 0.52);
            margin-bottom: 0.85rem;
        }
        h1 {
            font-family: "Barlow Condensed", system-ui, sans-serif;
            font-size: 3rem;
            line-height: 0.95;
            font-weight: 800;
            letter-spacing: 0;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }
        @media (min-width: 720px) {
            h1 { font-size: 4rem; }
        }
        p {
            max-width: 32ch;
            line-height: 1.6;
            margin-bottom: 2rem;
            color: var(--ink-soft);
        }
        a {
            color: var(--survey);
            font-weight: 700;
            text-underline-offset: 0.3em;
        }
    </style>
</head>
<body>
    <main>
        <div class="eyebrow">404 · survey anomaly</div>
        <h1>Depth not found</h1>
        <p>This stratum doesn't exist. Return to the surface to continue the field survey.</p>
        <p><a href="/">Back to Ground Truth</a></p>
    </main>
</body>
</html>
