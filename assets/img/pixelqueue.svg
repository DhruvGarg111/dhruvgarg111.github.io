<svg viewBox="0 0 800 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="p2g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="p2g2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="p2shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#1B2A22" flood-opacity="0.12"/></filter>
        <filter id="p2lift" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="3" dy="5" stdDeviation="7" flood-color="#1B2A22" flood-opacity="0.2"/></filter>
        <filter id="p2deep" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="4" dy="6" stdDeviation="10" flood-color="#1B2A22" flood-opacity="0.25"/></filter>
        <radialGradient id="p2blast" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FF5B62" stop-opacity="0.15"/><stop offset="40%" stop-color="#FF5B62" stop-opacity="0.05"/><stop offset="100%" stop-color="#F7F4EB" stop-opacity="0"/></radialGradient>
        <radialGradient id="p2inner" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FF5B62" stop-opacity="0.25"/><stop offset="100%" stop-color="#F7F4EB" stop-opacity="0"/></radialGradient>
        <linearGradient id="p2in" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#33CCFF" stop-opacity="0"/><stop offset="100%" stop-color="#33CCFF" stop-opacity="0.8"/></linearGradient>
        <linearGradient id="p2out" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FF5B62" stop-opacity="0.8"/><stop offset="100%" stop-color="#FF5B62" stop-opacity="0"/></linearGradient>
        <linearGradient id="p2panelG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F7F4EB" stop-opacity="0.96"/><stop offset="100%" stop-color="#EAE6D9" stop-opacity="0.88"/></linearGradient>
    </defs>

    <rect width="800" height="400" fill="none"/>

    <!-- Subtle isometric grid -->
    <g opacity="0.02" stroke="#1B2A22" stroke-width="0.4">
        <line x1="0" y1="400" x2="400" y2="0"/><line x1="200" y1="400" x2="600" y2="0"/><line x1="400" y1="400" x2="800" y2="0"/>
        <line x1="800" y1="400" x2="400" y2="0"/><line x1="600" y1="400" x2="200" y2="0"/><line x1="400" y1="400" x2="0" y2="0"/>
    </g>

    <!-- ===== TITLE BAR (raised) ===== -->
    <rect width="800" height="32" fill="url(#p2panelG)" filter="url(#p2shadow)"/>
    <rect width="800" height="1" y="31" fill="#1B2A22" opacity="0.15"/>
    <circle cx="20" cy="16" r="5" fill="#FF5B62" filter="url(#p2g)"><animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="20" cy="16" r="8" fill="none" stroke="#FF5B62" stroke-width="0.5" opacity="0.3"><animate attributeName="r" values="7;10;7" dur="2s" repeatCount="indefinite"/></circle>
    <text x="35" y="20" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="13" font-weight="bold" letter-spacing="3.5">PIXEL :: QUEUE</text>
    <text x="775" y="13" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="7" font-weight="bold" opacity="0.4" text-anchor="end" letter-spacing="1">VISION INTELLIGENCE INFRASTRUCTURE</text>
    <text x="775" y="25" fill="#FF5B62" font-family="'Share Tech Mono',monospace" font-size="8" font-weight="bold" text-anchor="end">4× A100 WORKERS · 1,247 IMG/MIN</text>

    <!-- ===== CENTRAL GPU CORE (massive 3D feel) ===== -->
    <circle cx="400" cy="182" r="170" fill="url(#p2blast)" filter="url(#p2g2)"/>
    <g transform="translate(400, 182)">
        <!-- Outermost ring -->
        <circle r="115" fill="none" stroke="#1B2A22" stroke-width="0.5" stroke-dasharray="3 8" opacity="0.1">
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
        </circle>
        <!-- Outer orbital ring -->
        <circle r="102" fill="none" stroke="#1B2A22" stroke-width="1" stroke-dasharray="6 14" opacity="0.15">
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
        </circle>
        <!-- Middle ring -->
        <circle r="88" fill="none" stroke="#FF5B62" stroke-width="1" stroke-dasharray="4 16" opacity="0.22">
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="22s" repeatCount="indefinite"/>
        </circle>
        <!-- Inner structural ring -->
        <circle r="75" fill="none" stroke="#1B2A22" stroke-width="1.5" opacity="0.1"/>

        <!-- 3D Hexagon with layered depth -->
        <!-- Shadow hex -->
        <polygon points="0,-58 50,-29 50,29 0,58 -50,29 -50,-29" fill="#1B2A22" opacity="0.06" transform="translate(3,4)"/>
        <!-- Mid hex -->
        <polygon points="0,-58 50,-29 50,29 0,58 -50,29 -50,-29" fill="#EAE6D9" stroke="#1B2A22" stroke-width="1.2" transform="translate(1.5,2)"/>
        <!-- Top hex -->
        <polygon points="0,-58 50,-29 50,29 0,58 -50,29 -50,-29" fill="#F7F4EB" stroke="#1B2A22" stroke-width="2.2"/>
        <polygon points="0,-58 50,-29 50,29 0,58 -50,29 -50,-29" fill="none" stroke="#FF5B62" stroke-width="0.8" opacity="0.3"/>
        <!-- Isometric hex top face illusion -->
        <line x1="0" y1="-58" x2="0" y2="58" stroke="#1B2A22" stroke-width="0.3" opacity="0.06"/>
        <line x1="-50" y1="0" x2="50" y2="0" stroke="#1B2A22" stroke-width="0.3" opacity="0.06"/>
        <!-- Inner detail hex -->
        <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="none" stroke="#1B2A22" stroke-width="0.5" opacity="0.08"/>
        <!-- Glow -->
        <circle r="30" fill="url(#p2inner)"/>
        <!-- GPU text -->
        <text x="0" y="-5" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="2.5">GPU</text>
        <text x="0" y="13" fill="#FF5B62" font-family="'Share Tech Mono',monospace" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="1.5">INFERENCE</text>

        <!-- Orbiting workers (with trails) -->
        <g><circle cx="90" cy="0" r="5.5" fill="#FF5B62" filter="url(#p2g)"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/></circle></g>
        <g><circle cx="-90" cy="0" r="5" fill="#33CCFF" filter="url(#p2g)"><animateTransform attributeName="transform" type="rotate" from="90" to="450" dur="10s" repeatCount="indefinite"/></circle></g>
        <g><circle cx="0" cy="-90" r="5" fill="#1B2A22" opacity="0.5"><animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="12s" repeatCount="indefinite"/></circle></g>
        <g><circle cx="0" cy="90" r="4.5" fill="#F59E0B" filter="url(#p2g)"><animateTransform attributeName="transform" type="rotate" from="270" to="630" dur="14s" repeatCount="indefinite"/></circle></g>
    </g>

    <!-- ===== LEFT: INPUT STREAM ===== -->
    <line x1="0" y1="182" x2="295" y2="182" stroke="url(#p2in)" stroke-width="4"/>
    <line x1="0" y1="182" x2="295" y2="182" stroke="#1B2A22" stroke-width="1" stroke-dasharray="10 20" opacity="0.2">
        <animate attributeName="stroke-dashoffset" values="30;0" dur="1s" repeatCount="indefinite"/>
    </line>

    <!-- Image frames with 3D stacking -->
    <!-- Frame 3 (farthest) -->
    <g opacity="0.2" filter="url(#p2shadow)">
        <rect x="26" y="140" width="52" height="38" rx="3" fill="#F7F4EB" stroke="#1B2A22" stroke-width="0.8"/>
    </g>
    <!-- Frame 2 -->
    <g opacity="0.5" filter="url(#p2shadow)">
        <rect x="88" y="146" width="58" height="42" rx="3" fill="#F7F4EB" stroke="#1B2A22" stroke-width="1"/>
        <rect x="94" y="152" width="18" height="12" fill="#33CCFF" opacity="0.08" rx="1"/>
        <rect x="94" y="168" width="30" height="8" fill="#1B2A22" opacity="0.04" rx="1"/>
    </g>
    <!-- Frame 1 (nearest, full 3D) -->
    <g filter="url(#p2lift)">
        <rect x="162" y="150" width="68" height="50" rx="3" fill="#F7F4EB" stroke="#33CCFF" stroke-width="2"/>
        <circle cx="186" cy="166" r="8" fill="#33CCFF" opacity="0.1"/>
        <polygon points="170,190 186,167 202,190 216,176 216,195 170,195" fill="#33CCFF" opacity="0.12"/>
        <rect x="165" y="153" width="26" height="11" rx="2" fill="#33CCFF"/>
        <text x="178" y="161" fill="#F7F4EB" font-family="'Share Tech Mono',monospace" font-size="7" font-weight="bold" text-anchor="middle">RAW</text>
    </g>

    <!-- Input labels (raised cards) -->
    <g transform="translate(26, 52)" filter="url(#p2shadow)">
        <rect width="140" height="44" rx="4" fill="url(#p2panelG)"/>
        <rect width="140" height="44" rx="4" fill="none" stroke="#1B2A22" stroke-width="1" opacity="0.15"/>
        <rect width="4" height="44" rx="2" fill="#33CCFF"/>
        <text x="14" y="18" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="9" font-weight="bold" letter-spacing="0.5">INGRESS QUEUE</text>
        <text x="14" y="31" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="7" opacity="0.5">Redis · 23 pending</text>
    </g>
    <g transform="translate(26, 246)" filter="url(#p2shadow)">
        <rect width="140" height="44" rx="4" fill="url(#p2panelG)"/>
        <rect width="140" height="44" rx="4" fill="none" stroke="#1B2A22" stroke-width="1" opacity="0.15"/>
        <rect width="4" height="44" rx="2" fill="#33CCFF"/>
        <text x="14" y="18" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="9" font-weight="bold" letter-spacing="0.5">REACT CANVAS</text>
        <text x="14" y="31" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="7" opacity="0.5">Vite · WebGL2 render</text>
    </g>

    <!-- ===== RIGHT: OUTPUT STREAM ===== -->
    <line x1="505" y1="182" x2="800" y2="182" stroke="url(#p2out)" stroke-width="4"/>
    <line x1="505" y1="182" x2="800" y2="182" stroke="#FF5B62" stroke-width="1" stroke-dasharray="10 20" opacity="0.2">
        <animate attributeName="stroke-dashoffset" values="30;0" dur="1s" repeatCount="indefinite"/>
    </line>

    <!-- Output frames with 3D -->
    <g filter="url(#p2lift)">
        <rect x="530" y="150" width="68" height="50" rx="3" fill="#F7F4EB" stroke="#FF5B62" stroke-width="2"/>
        <rect x="540" y="162" width="26" height="22" fill="none" stroke="#FF5B62" stroke-width="1.2"/>
        <rect x="540" y="156" width="18" height="8" fill="#FF5B62"/>
        <text x="549" y="163" fill="#F7F4EB" font-family="'Share Tech Mono',monospace" font-size="6" font-weight="bold" text-anchor="middle">.96</text>
        <circle cx="590" cy="156" r="4.5" fill="#FF5B62" opacity="0.7" filter="url(#p2g)"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" repeatCount="indefinite"/></circle>
    </g>
    <g opacity="0.45" filter="url(#p2shadow)">
        <rect x="618" y="146" width="58" height="42" rx="3" fill="#F7F4EB" stroke="#1B2A22" stroke-width="1"/>
    </g>
    <g opacity="0.2" filter="url(#p2shadow)">
        <rect x="696" y="142" width="52" height="38" rx="3" fill="#F7F4EB" stroke="#1B2A22" stroke-width="0.8"/>
    </g>

    <!-- Output labels -->
    <g transform="translate(634, 52)" filter="url(#p2shadow)">
        <rect width="140" height="44" rx="4" fill="url(#p2panelG)"/>
        <rect width="140" height="44" rx="4" fill="none" stroke="#1B2A22" stroke-width="1" opacity="0.15"/>
        <rect x="136" width="4" height="44" rx="2" fill="#FF5B62"/>
        <text x="126" y="18" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="9" font-weight="bold" text-anchor="end" letter-spacing="0.5">YOLO // SAM</text>
        <text x="126" y="31" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="7" opacity="0.5" text-anchor="end">Detect + Segment</text>
    </g>
    <g transform="translate(634, 246)" filter="url(#p2shadow)">
        <rect width="140" height="44" rx="4" fill="url(#p2panelG)"/>
        <rect width="140" height="44" rx="4" fill="none" stroke="#1B2A22" stroke-width="1" opacity="0.15"/>
        <rect x="136" width="4" height="44" rx="2" fill="#FF5B62"/>
        <text x="126" y="18" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="9" font-weight="bold" text-anchor="end" letter-spacing="0.5">CELERY BROKER</text>
        <text x="126" y="31" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="7" opacity="0.5" text-anchor="end">4 workers · prefetch</text>
    </g>

    <!-- ===== BOTTOM METRICS STRIP (raised) ===== -->
    <g filter="url(#p2shadow)">
        <rect x="0" y="316" width="800" height="84" fill="url(#p2panelG)"/>
    </g>
    <rect x="0" y="315" width="800" height="1" fill="#1B2A22" opacity="0.12"/>

    <g font-family="'Share Tech Mono',monospace">
        <g transform="translate(30, 328)">
            <text y="8" fill="#1B2A22" font-size="7" font-weight="bold" opacity="0.4" letter-spacing="1.5">THROUGHPUT</text>
            <text y="28" fill="#1B2A22" font-size="18" font-weight="bold">1,247</text>
            <text x="55" y="28" fill="#1B2A22" font-size="8" opacity="0.35">img/min</text>
            <!-- Sparkline with fill -->
            <polygon points="0,50 14,46 28,52 42,42 56,48 70,38 84,44 98,34 112,40 126,30 140,36 140,56 0,56" fill="#33CCFF" opacity="0.06"/>
            <polyline points="0,50 14,46 28,52 42,42 56,48 70,38 84,44 98,34 112,40 126,30 140,36" fill="none" stroke="#33CCFF" stroke-width="1.5"/>
            <circle cx="140" cy="36" r="3" fill="#33CCFF" filter="url(#p2g)"/>
        </g>
        <g transform="translate(230, 328)">
            <text y="8" fill="#1B2A22" font-size="7" font-weight="bold" opacity="0.4" letter-spacing="1.5">QUEUE LENGTH</text>
            <text y="28" fill="#1B2A22" font-size="18" font-weight="bold">23</text>
            <text x="28" y="28" fill="#1B2A22" font-size="8" opacity="0.35">tasks</text>
            <g transform="translate(0, 37)">
                <rect x="0" y="2" width="10" height="17" rx="1.5" fill="#33CCFF" opacity="0.55"/>
                <rect x="14" y="5" width="10" height="14" rx="1.5" fill="#33CCFF" opacity="0.45"/>
                <rect x="28" y="8" width="10" height="11" rx="1.5" fill="#33CCFF" opacity="0.35"/>
                <rect x="42" y="11" width="10" height="8" rx="1.5" fill="#33CCFF" opacity="0.25"/>
                <rect x="56" y="13" width="10" height="6" rx="1.5" fill="#33CCFF" opacity="0.18"/>
            </g>
        </g>
        <g transform="translate(420, 328)">
            <text y="8" fill="#1B2A22" font-size="7" font-weight="bold" opacity="0.4" letter-spacing="1.5">P99 LATENCY</text>
            <text y="28" fill="#FF5B62" font-size="18" font-weight="bold">42<tspan fill="#1B2A22" font-size="8" opacity="0.35">ms</tspan></text>
            <g transform="translate(0, 37)" fill="#FF5B62">
                <rect x="0" y="12" width="8" height="5" rx="1" opacity="0.25"/>
                <rect x="11" y="8" width="8" height="9" rx="1" opacity="0.35"/>
                <rect x="22" y="3" width="8" height="14" rx="1" opacity="0.55"/>
                <rect x="33" y="0" width="8" height="17" rx="1" opacity="0.75"/>
                <rect x="44" y="4" width="8" height="13" rx="1" opacity="0.6"/>
                <rect x="55" y="7" width="8" height="10" rx="1" opacity="0.4"/>
            </g>
        </g>
        <g transform="translate(610, 328)">
            <text y="8" fill="#1B2A22" font-size="7" font-weight="bold" opacity="0.4" letter-spacing="1.5">WORKER STATUS</text>
            <text y="28" fill="#1B2A22" font-size="17" font-weight="bold">4 ACTIVE</text>
            <g transform="translate(0, 37)">
                <circle cx="7" cy="7" r="5" fill="#FF5B62" filter="url(#p2g)"/>
                <circle cx="22" cy="7" r="5" fill="#FF5B62"/>
                <circle cx="37" cy="7" r="5" fill="#33CCFF"/>
                <circle cx="52" cy="7" r="5" fill="#FF5B62"/>
                <!-- Worker labels -->
                <text x="7" y="20" fill="#1B2A22" font-size="5" text-anchor="middle" opacity="0.3">W1</text>
                <text x="22" y="20" fill="#1B2A22" font-size="5" text-anchor="middle" opacity="0.3">W2</text>
                <text x="37" y="20" fill="#1B2A22" font-size="5" text-anchor="middle" opacity="0.3">W3</text>
                <text x="52" y="20" fill="#1B2A22" font-size="5" text-anchor="middle" opacity="0.3">W4</text>
            </g>
        </g>
    </g>
</svg>
