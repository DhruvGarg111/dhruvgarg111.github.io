<svg viewBox="0 0 800 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Deep Space Background -->
        <radialGradient id="spaceGradient" cx="50%" cy="50%" r="75%">
            <stop offset="0%" stop-color="#0a051a"/>
            <stop offset="50%" stop-color="#05030d"/>
            <stop offset="100%" stop-color="#000000"/>
        </radialGradient>

        <!-- Premium Core Glows -->
        <radialGradient id="cyanCore" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.5"/>
            <stop offset="60%" stop-color="#0891B2" stop-opacity="0.1"/>
            <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="purpleCore" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.5"/>
            <stop offset="60%" stop-color="#6D28D9" stop-opacity="0.1"/>
            <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
        </radialGradient>

        <!-- Glassmorphism Panel Gradient -->
        <linearGradient id="glassLinear" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
        </linearGradient>

        <!-- Dynamic Data Streams -->
        <linearGradient id="streamCyan" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
            <stop offset="50%" stop-color="#06B6D4" stop-opacity="1"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="streamPurple" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
            <stop offset="50%" stop-color="#8B5CF6" stop-opacity="1"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </linearGradient>

        <!-- Advanced Filters -->
        <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="10" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
        <filter id="neonGlowCyan" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="5" result="blur1"/>
            <feGaussianBlur stdDeviation="12" result="blur2"/>
            <feMerge>
                <feMergeNode in="blur2"/>
                <feMergeNode in="blur1"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="neonGlowPurple" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="5" result="blur1"/>
            <feGaussianBlur stdDeviation="12" result="blur2"/>
            <feMerge>
                <feMergeNode in="blur2"/>
                <feMergeNode in="blur1"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="deepShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#000000" flood-opacity="0.9"/>
            <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.7"/>
        </filter>

        <!-- Isometric Grid Pattern -->
        <pattern id="isoGrid" width="60" height="34.641" patternUnits="userSpaceOnUse">
            <path d="M 0 17.32 L 30 0 L 60 17.32 L 30 34.64 Z" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.05"/>
        </pattern>
        
        <!-- Animated Particles Path -->
        <path id="flowPath1" d="M -50 250 C 200 400, 600 -50, 850 150" fill="none" />
        <path id="flowPath2" d="M -50 150 C 200 -50, 600 400, 850 250" fill="none" />
    </defs>

    <!-- Base Environment -->
    <rect width="100%" height="100%" fill="url(#spaceGradient)"/>
    
    <!-- Ambient Core Illuminations (Scaled up) -->
    <circle cx="200" cy="220" r="400" fill="url(#cyanCore)"/>
    <circle cx="600" cy="220" r="400" fill="url(#purpleCore)"/>
    
    <!-- Isometric Floor Grid -->
    <g transform="translate(0, 150) scale(1, 0.45) rotate(45, 400, 200)">
        <rect x="-600" y="-600" width="2000" height="2000" fill="url(#isoGrid)"/>
        <!-- Sweeping scanner light -->
        <line x1="-600" y1="-600" x2="1400" y2="1400" stroke="#06B6D4" stroke-width="3" opacity="0.4" filter="url(#neonGlowCyan)">
            <animate attributeName="x1" values="-600;1400;-600" dur="10s" repeatCount="indefinite" />
            <animate attributeName="y1" values="-600;1400;-600" dur="10s" repeatCount="indefinite" />
            <animate attributeName="x2" values="0;2000;0" dur="10s" repeatCount="indefinite" />
            <animate attributeName="y2" values="0;2000;0" dur="10s" repeatCount="indefinite" />
        </line>
    </g>

    <!-- Dynamic Energy Streams (Thicker, more aggressive curves) -->
    <g opacity="0.9">
        <path d="M -50 250 C 200 400, 600 -50, 850 150" fill="none" stroke="url(#streamCyan)" stroke-width="12" filter="url(#neonGlowCyan)" opacity="0.4"/>
        <path d="M -50 150 C 200 -50, 600 400, 850 250" fill="none" stroke="url(#streamPurple)" stroke-width="12" filter="url(#neonGlowPurple)" opacity="0.4"/>
        
        <path d="M -50 250 C 200 400, 600 -50, 850 150" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="15 30" opacity="0.8">
            <animate attributeName="stroke-dashoffset" values="45;0" dur="1.2s" repeatCount="indefinite" />
        </path>
        <path d="M -50 150 C 200 -50, 600 400, 850 250" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="15 30" opacity="0.8">
            <animate attributeName="stroke-dashoffset" values="45;0" dur="1.2s" repeatCount="indefinite" />
        </path>
    </g>

    <g>
        <circle r="6" fill="#FFF" filter="url(#neonGlowCyan)">
            <animateMotion dur="4s" repeatCount="indefinite" rotate="auto"><mpath href="#flowPath1"/></animateMotion>
        </circle>
        <circle r="4" fill="#FFF" filter="url(#neonGlowCyan)">
            <animateMotion dur="5.5s" repeatCount="indefinite" rotate="auto" begin="1s"><mpath href="#flowPath1"/></animateMotion>
        </circle>
        <circle r="6" fill="#FFF" filter="url(#neonGlowPurple)">
            <animateMotion dur="4.5s" repeatCount="indefinite" rotate="auto" begin="0.5s"><mpath href="#flowPath2"/></animateMotion>
        </circle>
        <circle r="7" fill="#FFF" filter="url(#neonGlowPurple)">
            <animateMotion dur="6s" repeatCount="indefinite" rotate="auto" begin="2s"><mpath href="#flowPath2"/></animateMotion>
        </circle>
    </g>

    <!-- ABSTRACT CENTRAL PROCESSING CORES (Scaled Up 1.5x) -->
    <!-- Node 1: Ingestion -->
    <g transform="translate(180, 220) scale(1.3)" filter="url(#deepShadow)">
        <circle cx="0" cy="0" r="60" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="10 15" opacity="0.6">
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="0" r="45" fill="none" stroke="#0891B2" stroke-width="3" opacity="0.7"/>
        
        <!-- Glass Core -->
        <polygon points="0,-35 35,0 0,35 -35,0" fill="url(#glassLinear)" stroke="#06B6D4" stroke-width="2" filter="url(#glassBlur)"/>
        <!-- Inner glowing diamond -->
        <polygon points="0,-15 15,0 0,15 -15,0" fill="#06B6D4" filter="url(#neonGlowCyan)">
            <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
        </polygon>
    </g>

    <g transform="translate(180, 145)">
        <rect x="-60" y="-15" width="120" height="30" rx="4" fill="#020617" stroke="#1E293B" stroke-width="1.5" opacity="0.9"/>
        <text x="0" y="3" fill="#06B6D4" font-family="monospace" font-size="12" font-weight="900" text-anchor="middle">INGRESS_QUEUE</text>
    </g>

    <!-- Node 2: Deep Learning Inference -->
    <g transform="translate(620, 220) scale(1.3)" filter="url(#deepShadow)">
        <circle cx="0" cy="0" r="70" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="6 18" opacity="0.6">
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="25s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="0" r="50" fill="none" stroke="#6D28D9" stroke-width="3" opacity="0.7"/>
        
        <polygon points="0,-40 40,0 0,40 -40,0" fill="url(#glassLinear)" stroke="#8B5CF6" stroke-width="2" filter="url(#glassBlur)"/>
        
        <polygon points="0,-20 20,0 0,20 -20,0" fill="#8B5CF6" filter="url(#neonGlowPurple)">
            <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite"/>
        </polygon>
        <circle cx="0" cy="0" r="6" fill="#FFF" filter="url(#neonGlowPurple)"/>
    </g>

    <g transform="translate(620, 340)">
        <rect x="-60" y="-15" width="120" height="30" rx="4" fill="#020617" stroke="#312E81" stroke-width="1.5" opacity="0.9"/>
        <text x="0" y="4" fill="#A78BFA" font-family="monospace" font-size="14" font-weight="900" text-anchor="middle">YOLO // SAM</text>
    </g>

    <!-- Central Control Interface (Scaled Up) -->
    <g transform="translate(200, 30)" filter="url(#deepShadow)">
        <rect width="400" height="100" rx="12" fill="url(#glassLinear)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.2" filter="url(#glassBlur)"/>
        <path d="M 0 12 C 0 5.3 5.3 0 12 0 L 388 0 C 394.6 0 400 5.3 400 12" fill="none" stroke="url(#streamCyan)" stroke-width="3"/>
        
        <text x="200" y="38" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="24" font-weight="900" letter-spacing="5" text-anchor="middle">PIXEL :: QUEUE</text>
        <text x="200" y="58" fill="#94A3B8" font-family="monospace" font-size="11" font-weight="600" letter-spacing="2" text-anchor="middle">VISION INTELLIGENCE INFRASTRUCTURE</text>
        
        <!-- Bigger Status Badges -->
        <g transform="translate(130, 74)">
            <rect x="0" y="0" width="65" height="18" rx="9" fill="#06B6D4" fill-opacity="0.1" stroke="#06B6D4" stroke-opacity="0.4"/>
            <circle cx="12" cy="9" r="4" fill="#06B6D4" filter="url(#neonGlowCyan)"/>
            <text x="35" y="13" fill="#06B6D4" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">SYS.RDY</text>
        </g>
        <g transform="translate(205, 74)">
            <rect x="0" y="0" width="70" height="18" rx="9" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-opacity="0.4"/>
            <circle cx="12" cy="9" r="4" fill="#8B5CF6" filter="url(#neonGlowPurple)"/>
            <text x="38" y="13" fill="#8B5CF6" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">ASYNC_ML</text>
        </g>
    </g>

    <!-- Technical Background Spec Boxes (Filling negative space) -->
    <g transform="translate(30, 310)" filter="url(#deepShadow)">
        <rect width="210" height="60" rx="6" fill="#020617" stroke="#1E293B" stroke-width="1.5" opacity="0.8"/>
        <text x="15" y="25" fill="#06B6D4" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">REACT / VITE CANVAS</text>
        <text x="15" y="45" fill="#94A3B8" font-family="monospace" font-size="11" letter-spacing="1">ZERO LATENCY RENDERING</text>
    </g>
    
    <g transform="translate(560, 40)" filter="url(#deepShadow)">
        <rect width="210" height="60" rx="6" fill="#020617" stroke="#312E81" stroke-width="1.5" opacity="0.8"/>
        <text x="195" y="25" fill="#8B5CF6" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1" text-anchor="end">CELERY TASK BROKERS</text>
        <text x="195" y="45" fill="#94A3B8" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="end">DECOUPLED GPU WORKERS</text>
    </g>

    <!-- Abstract HUD Frame -->
    <g stroke="#334155" stroke-width="2" fill="none">
        <path d="M 30 50 L 30 30 L 50 30"/>
        <path d="M 770 50 L 770 30 L 750 30"/>
        <path d="M 30 350 L 30 370 L 50 370"/>
        <path d="M 770 350 L 770 370 L 750 370"/>
    </g>

</svg>
