<svg viewBox="0 0 800 320" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="glow-orange" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="glow-red" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="glow-yellow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <linearGradient id="orange-fade" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#7c2d12" stop-opacity="0.05"/>
        </linearGradient>
        <linearGradient id="red-fade" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0.05"/>
        </linearGradient>
        <pattern id="hex-bg" width="40" height="69.28" patternUnits="userSpaceOnUse" patternTransform="scale(0.5)">
            <path d="M20 0 L40 11.55 L40 34.64 L20 46.19 L0 34.64 L0 11.55 Z" fill="none" stroke="#1E293B" stroke-width="1.5" opacity="0.4"/>
            <path d="M20 69.28 L40 57.74 L40 34.64 L20 46.19 L0 34.64 L0 57.74 Z" fill="none" stroke="#1E293B" stroke-width="1.5" opacity="0.4"/>
        </pattern>
        <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#020617"/>
            <stop offset="100%" stop-color="#0F172A"/>
        </linearGradient>
    </defs>

    <rect width="100%" height="100%" fill="url(#bg-grad)"/>
    <rect width="100%" height="100%" fill="url(#hex-bg)"/>
    
    <!-- Connectors -->
    <path d="M 240 95 C 280 95, 280 140, 320 140" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 6">
        <animate attributeName="stroke-dashoffset" values="24;0" dur="1.5s" repeatCount="indefinite" />
    </path>
    <path d="M 240 225 C 280 225, 280 140, 320 140" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 6">
