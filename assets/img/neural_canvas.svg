        <rect x="0" y="0" width="220" height="240" rx="6" fill="url(#orange-fade)"/>
        
        <text x="110" y="20" fill="#ff7e29" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">TRANSFORM_NET</text>
        <line x1="0" y1="28" x2="220" y2="28" stroke="#1E293B" stroke-width="1.5"/>
        
        <g transform="translate(0, 10)">
            <rect x="25" y="50" width="16" height="80" rx="2" fill="#ef4444" opacity="0.5"/>
            <rect x="49" y="60" width="16" height="60" rx="2" fill="#ff7e29" opacity="0.7"/>
            <rect x="73" y="70" width="16" height="40" rx="2" fill="#f59e0b" opacity="0.9"/>
            
            <rect x="97" y="75" width="12" height="30" rx="2" fill="#f59e0b" filter="url(#glow-yellow)"/>
            <rect x="115" y="75" width="12" height="30" rx="2" fill="#f59e0b" filter="url(#glow-yellow)"/>
            
            <rect x="133" y="70" width="16" height="40" rx="2" fill="#f59e0b" opacity="0.9"/>
            <rect x="157" y="60" width="16" height="60" rx="2" fill="#ff7e29" opacity="0.7" filter="url(#glow-orange)"/>
            <rect x="181" y="50" width="16" height="80" rx="2" fill="#ef4444" opacity="0.5"/>
            
            <path d="M 41 90 L 49 90 M 65 90 L 73 90 M 89 90 L 97 90 M 109 90 L 115 90 M 127 90 L 133 90 M 149 90 L 157 90 M 173 90 L 181 90" stroke="#f59e0b" stroke-width="1.5"/>
