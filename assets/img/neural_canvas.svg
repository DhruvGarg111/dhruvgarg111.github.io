        <text x="110" y="189" fill="#ef4444" font-size="10" font-family="monospace" font-weight="bold" text-anchor="middle">VGG-16 PERCEPTUAL LOSS</text>
        
        <line x1="110" y1="170" x2="110" y2="140" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 4" filter="url(#glow-red)"/>
        <polygon points="110,135 106,142 114,142" fill="#ef4444"/>
    </g>

    <!-- Output Box -->
    <g transform="translate(600, 105)">
        <rect x="0" y="0" width="180" height="110" rx="6" fill="#000" stroke="#1E293B" stroke-width="1.5"/>
        <rect x="0" y="0" width="180" height="110" rx="6" fill="none" stroke="#ff7e29" stroke-width="1.5" filter="url(#glow-orange)"/>
        <rect x="0" y="0" width="180" height="110" rx="6" fill="url(#orange-fade)"/>
        
        <text x="12" y="20" fill="#ff7e29" font-family="monospace" font-size="10" font-weight="bold">STYLIZED_SYS_OUT</text>
        <line x1="0" y1="28" x2="180" y2="28" stroke="#1E293B" stroke-width="1.5"/>
        
        <rect x="40" y="40" width="100" height="55" rx="4" fill="#0F172A" stroke="#ff7e29" stroke-width="2" filter="url(#glow-orange)"/>
        <circle cx="65" cy="55" r="8" fill="#f59e0b"/>
        <path d="M 40 95 L 70 65 L 95 90 L 115 70 L 140 95" fill="none" stroke="#ff7e29" stroke-width="2"/>
        
        <circle cx="50" cy="80" r="2" fill="#ef4444"/>
        <circle cx="85" cy="70" r="2.5" fill="#ef4444"/>
        <circle cx="120" cy="80" r="2" fill="#f59e0b"/>
        <path d="M 45 45 C 55 40, 65 55, 75 45" fill="none" stroke="#ef4444" stroke-width="1.5"/>
        <path d="M 100 50 C 110 45, 120 60, 130 50" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    </g>

    <!-- Telemetry -->
    <text x="30" y="310" fill="#475569" font-size="10" font-family="monospace" letter-spacing="1">STATUS :: 🟢 INFERENCE_READY</text>
    <text x="600" y="310" fill="#475569" font-size="10" font-family="monospace" letter-spacing="1">LATENCY: 12ms | VRAM: 1.2GB</text>
</svg>
