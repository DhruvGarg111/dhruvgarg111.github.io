<svg viewBox="0 0 800 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="neuralAura" cx="50%" cy="50%" r="65%">
            <stop offset="0%" stop-color="#451a03"/>
            <stop offset="50%" stop-color="#050510"/>
            <stop offset="100%" stop-color="#000000"/>
        </radialGradient>

        <linearGradient id="warmEnergy" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#fb923c" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#fef08a" stop-opacity="0.3"/>
        </linearGradient>

        <linearGradient id="coolEnergy" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#ddd6fe" stop-opacity="0.3"/>
        </linearGradient>

        <linearGradient id="glassLinear" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
            <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
        </linearGradient>

        <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="12" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>

        <filter id="superGlowOrange" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="20" result="blur2"/>
            <feGaussianBlur stdDeviation="6" result="blur1"/>
            <feMerge>
                <feMergeNode in="blur2"/>
                <feMergeNode in="blur1"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <filter id="shadowHeavy" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#000" flood-opacity="1"/>
            <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.8"/>
        </filter>

        <pattern id="connectome" width="100" height="100" patternUnits="userSpaceOnUse" patternTransform="scale(0.8)">
            <circle cx="20" cy="20" r="1.5" fill="#f59e0b" opacity="0.4"/>
            <circle cx="70" cy="70" r="2.5" fill="#f59e0b" opacity="0.3"/>
            <path d="M 20 20 L 70 70" stroke="#f59e0b" stroke-width="1" opacity="0.2"/>
            <path d="M -30 -30 L 20 20" stroke="#f59e0b" stroke-width="1" opacity="0.2"/>
            <path d="M 70 70 L 120 120" stroke="#f59e0b" stroke-width="1" opacity="0.2"/>
        </pattern>
    </defs>

    <!-- Base Canvas -->
    <rect width="100%" height="100%" fill="url(#neuralAura)"/>
    <rect width="100%" height="100%" fill="url(#connectome)"/>

    <!-- Central Floating Dashboard (Scaled Up) -->
    <g transform="translate(200, 30)" filter="url(#shadowHeavy)">
        <rect width="400" height="90" rx="12" fill="url(#glassLinear)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" filter="url(#glassBlur)"/>
        <path d="M 0 12 C 0 5.3 5.3 0 12 0 L 388 0 C 394.6 0 400 5.3 400 12" fill="none" stroke="#f97316" stroke-width="3" filter="url(#superGlowOrange)" opacity="0.9"/>
        
        <text x="200" y="42" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="6" text-anchor="middle">NEURAL CANVAS</text>
        <text x="200" y="65" fill="#fcd34d" font-family="monospace" font-size="11" font-weight="600" letter-spacing="4" text-anchor="middle">REAL-TIME STYLE TRANSFER</text>
        <circle cx="200" cy="80" r="3.5" fill="#f59e0b" filter="url(#superGlowOrange)">
            <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
        </circle>
    </g>

    <!-- UI Decor elements (Larger and styled) -->
    <g stroke="#4B5563" stroke-width="2" fill="none">
        <path d="M 30 60 L 30 30 L 60 30"/>
        <path d="M 770 60 L 770 30 L 740 30"/>
        <path d="M 30 340 L 30 370 L 60 370"/>
        <path d="M 770 340 L 770 370 L 740 370"/>
    </g>

    <!-- ISOMETRIC 3D STRUCTURE -->
    <!-- Scaled up drastically and centered better -->
    <!-- X moves down/right, Y moves up/right -->
    <g transform="translate(420, 250) scale(1.6, 0.8) rotate(-45)">
        
        <!-- Deep network beam -->
        <line x1="-280" y1="0" x2="280" y2="0" stroke="#f97316" stroke-width="6" filter="url(#superGlowOrange)" opacity="0.6"/>
        <line x1="-280" y1="0" x2="280" y2="0" stroke="#fff" stroke-width="2" stroke-dasharray="25 45">
            <animate attributeName="stroke-dashoffset" values="70;0" dur="1s" repeatCount="indefinite"/>
        </line>
        
        <!-- Content Input Vector -->
        <g transform="translate(-220, 0)">
            <rect x="-20" y="-20" width="40" height="40" fill="url(#coolEnergy)" stroke="#a78bfa" stroke-width="2.5" filter="url(#shadowHeavy)"/>
        </g>
        
        <!-- Style Input Vector -->
        <g transform="translate(-160, -90)">
            <line x1="0" y1="0" x2="0" y2="90" stroke="#f59e0b" stroke-width="4" filter="url(#superGlowOrange)" stroke-dasharray="12 12">
                 <animate attributeName="stroke-dashoffset" values="24;0" dur="0.8s" repeatCount="indefinite"/>
            </line>
            <rect x="-25" y="-25" width="50" height="50" fill="url(#warmEnergy)" stroke="#fcd34d" stroke-width="2.5" filter="url(#shadowHeavy)"/>
        </g>

        <!-- Downsampling Convolutions -->
        <g transform="translate(-130, 0)">
            <rect x="-30" y="-30" width="60" height="60" fill="url(#glassLinear)" stroke="#f59e0b" stroke-width="2.5" filter="url(#shadowHeavy)"/>
        </g>
        <g transform="translate(-80, 0)">
            <rect x="-40" y="-40" width="80" height="80" fill="url(#glassLinear)" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadowHeavy)"/>
        </g>

        <!-- The 5x Residual Blocks (Instance Norm Core) -->
        <g transform="translate(-30, 0)">
            <rect x="-50" y="-50" width="100" height="100" fill="url(#warmEnergy)" stroke="#fff" stroke-width="2.5" filter="url(#shadowHeavy)"/>
        </g>
        <g transform="translate(-10, 0)">
            <rect x="-50" y="-50" width="100" height="100" fill="url(#glassLinear)" stroke="#f59e0b" stroke-width="2" filter="url(#shadowHeavy)"/>
        </g>
        <g transform="translate(10, 0)">
            <rect x="-60" y="-60" width="120" height="120" fill="url(#warmEnergy)" stroke="#fff" stroke-width="3" filter="url(#shadowHeavy)"/>
            <!-- Heartbeat Core Process -->
            <circle cx="0" cy="0" r="30" fill="#fff" filter="url(#superGlowOrange)">
                 <animate attributeName="r" values="25;35;25" dur="1.5s" repeatCount="indefinite"/>
                 <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
            </circle>
        </g>
        <g transform="translate(30, 0)">
            <rect x="-50" y="-50" width="100" height="100" fill="url(#glassLinear)" stroke="#f59e0b" stroke-width="2" filter="url(#shadowHeavy)"/>
        </g>
        <g transform="translate(50, 0)">
            <rect x="-50" y="-50" width="100" height="100" fill="url(#warmEnergy)" stroke="#fff" stroke-width="2.5" filter="url(#shadowHeavy)"/>
        </g>

        <!-- Upsampling Blocks -->
        <g transform="translate(100, 0)">
             <rect x="-40" y="-40" width="80" height="80" fill="url(#glassLinear)" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadowHeavy)"/>
        </g>
        <g transform="translate(150, 0)">
             <rect x="-30" y="-30" width="60" height="60" fill="url(#glassLinear)" stroke="#f59e0b" stroke-width="2.5" filter="url(#shadowHeavy)"/>
        </g>

        <!-- Output Styled Tensor -->
        <g transform="translate(220, 0)">
            <rect x="-25" y="-25" width="50" height="50" fill="url(#warmEnergy)" stroke="#fff" stroke-width="3" filter="url(#shadowHeavy)"/>
            <path d="M -15 15 L 0 -15 L 15 15 Z" fill="#fff" opacity="0.9"/>
        </g>
    </g>

    <!-- Side Labels / Tech Specs Behind Block Backgrounds -->
    <g transform="translate(40, 290)" filter="url(#shadowHeavy)">
        <rect width="210" height="65" rx="6" fill="#050510" stroke="#78350F" stroke-width="2" opacity="0.9"/>
        <text x="15" y="25" fill="#F59E0B" font-family="monospace" font-size="12" font-weight="900" letter-spacing="2">INPUT_WGT</text>
        <text x="15" y="45" fill="#D1D5DB" font-family="monospace" font-size="10" letter-spacing="1">CONTENT VECTOR :: TENSOR</text>
    </g>
    
    <g transform="translate(550, 290)" filter="url(#shadowHeavy)">
        <rect width="210" height="65" rx="6" fill="#050510" stroke="#F59E0B" stroke-width="2" opacity="0.9"/>
        <text x="195" y="25" fill="#FCD34D" font-family="monospace" font-size="12" font-weight="900" letter-spacing="2" text-anchor="end">OUTPUT_OBJ</text>
        <text x="195" y="45" fill="#D1D5DB" font-family="monospace" font-size="10" letter-spacing="1" text-anchor="end">STYLIZED FRAME :: 40 FPS</text>
    </g>

    <!-- Line pointing to core -->
    <g transform="translate(320, 360)">
        <text x="80" y="0" fill="#9CA3AF" font-family="monospace" font-size="9" font-weight="900" letter-spacing="2" text-anchor="middle">5x RESIDUAL_BLOCKS (INSTANCE_NORM)</text>
        <path d="M 0 -10 L 80 -3 L 160 -10" fill="none" stroke="#6B7280" stroke-width="1.5"/>
    </g>

</svg>
