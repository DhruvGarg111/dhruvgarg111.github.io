        <circle cx="90" cy="65" r="22" fill="none" stroke="#ef4444" stroke-width="1.5"/>
        <circle cx="90" cy="65" r="14" fill="none" stroke="#ef4444" stroke-width="2" filter="url(#glow-red)"/>
        <circle cx="90" cy="65" r="6" fill="#ef4444"/>
        
        <path d="M 68 65 A 22 22 0 0 1 112 65" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.8"/>
    </g>

    <!-- Transform Net Box -->
    <g transform="translate(320, 40)">
