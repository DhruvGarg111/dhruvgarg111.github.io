<svg viewBox="0 0 800 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="ncG" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="ncG2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="ncG3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="ncSh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#1B2A22" flood-opacity="0.12"/></filter>
        <filter id="ncLift" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="3" dy="5" stdDeviation="7" flood-color="#1B2A22" flood-opacity="0.2"/></filter>
        <radialGradient id="ncPG" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FF5B62" stop-opacity="0.12"/><stop offset="40%" stop-color="#F59E0B" stop-opacity="0.05"/><stop offset="100%" stop-color="#F7F4EB" stop-opacity="0"/></radialGradient>
        <linearGradient id="ncCG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#33CCFF" stop-opacity="0.12"/><stop offset="100%" stop-color="#1B2A22" stop-opacity="0.03"/></linearGradient>
        <linearGradient id="ncOG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FF5B62" stop-opacity="0.12"/><stop offset="100%" stop-color="#F59E0B" stop-opacity="0.04"/></linearGradient>
        <linearGradient id="ncNF" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#33CCFF"/><stop offset="50%" stop-color="#FF5B62"/><stop offset="100%" stop-color="#F59E0B"/></linearGradient>
        <linearGradient id="ncPN" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F7F4EB" stop-opacity="0.96"/><stop offset="100%" stop-color="#EAE6D9" stop-opacity="0.88"/></linearGradient>
        <!-- Light beam gradients -->
        <linearGradient id="ncBcyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#33CCFF" stop-opacity="0.8"/><stop offset="100%" stop-color="#33CCFF" stop-opacity="0.15"/></linearGradient>
        <linearGradient id="ncBcoral" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FF5B62" stop-opacity="0.8"/><stop offset="100%" stop-color="#FF5B62" stop-opacity="0.15"/></linearGradient>
        <linearGradient id="ncBamber" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/><stop offset="100%" stop-color="#F59E0B" stop-opacity="0.15"/></linearGradient>
        <clipPath id="ncCC"><rect x="42" y="60" width="195" height="195" rx="5"/></clipPath>
        <clipPath id="ncOC"><rect x="563" y="60" width="195" height="195" rx="5"/></clipPath>
    </defs>

    <rect width="800" height="400" fill="none"/>
    <!-- Ambient prism glow -->
    <circle cx="400" cy="180" r="200" fill="url(#ncPG)" filter="url(#ncG3)"/>

    <!-- ===== TITLE BAR (raised) ===== -->
    <rect x="0" y="0" width="800" height="28" fill="url(#ncPN)" filter="url(#ncSh)"/>
    <rect x="0" y="27" width="800" height="1" fill="#1B2A22" opacity="0.15"/>
    <text x="400" y="18" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="14" font-weight="bold" letter-spacing="6" text-anchor="middle">NEURAL CANVAS</text>
    <text x="18" y="18" fill="#33CCFF" font-family="'Share Tech Mono',monospace" font-size="8" font-weight="bold" letter-spacing="1.5">CONTENT</text>
    <text x="782" y="18" fill="#FF5B62" font-family="'Share Tech Mono',monospace" font-size="8" font-weight="bold" letter-spacing="1.5" text-anchor="end">OUTPUT</text>
    <circle cx="82" cy="14" r="3" fill="#33CCFF" filter="url(#ncG)"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="718" cy="14" r="3" fill="#FF5B62" filter="url(#ncG)"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>

    <!-- ===== LEFT: CONTENT TENSOR (3D elevated panel) ===== -->
    <g filter="url(#ncLift)">
        <rect x="42" y="60" width="195" height="195" rx="6" fill="url(#ncCG)"/>
        <rect x="42" y="60" width="195" height="195" rx="6" fill="url(#ncPN)"/>
        <rect x="42" y="60" width="195" height="195" rx="6" fill="none" stroke="#33CCFF" stroke-width="1.5" opacity="0.6"/>
        <rect x="43" y="61" width="193" height="1" fill="#FFFFFF" opacity="0.5"/>
    </g>
    <!-- Reticle corners -->
    <path d="M 47 70 L 47 64 L 53 64" fill="none" stroke="#33CCFF" stroke-width="2" opacity="0.65"/>
    <path d="M 232 70 L 232 64 L 226 64" fill="none" stroke="#33CCFF" stroke-width="2" opacity="0.65"/>
    <path d="M 47 247 L 47 251 L 53 251" fill="none" stroke="#33CCFF" stroke-width="2" opacity="0.65"/>
    <path d="M 232 247 L 232 251 L 226 251" fill="none" stroke="#33CCFF" stroke-width="2" opacity="0.65"/>
    <!-- Content shapes — structured, geometric (3D blocks feel) -->
    <g clip-path="url(#ncCC)" opacity="0.6">
        <!-- Layered 3D blocks -->
        <rect x="58" y="82" width="58" height="58" fill="#33CCFF" opacity="0.12" transform="skewY(-2)"/>
        <rect x="60" y="84" width="54" height="54" fill="#1B2A22" opacity="0.05"/>
        <rect x="128" y="82" width="90" height="40" fill="#1B2A22" opacity="0.08"/>
        <rect x="130" y="84" width="86" height="36" fill="#33CCFF" opacity="0.04"/>
        <rect x="58" y="150" width="42" height="85" fill="#1B2A22" opacity="0.07"/>
        <rect x="110" y="132" width="72" height="52" fill="#33CCFF" opacity="0.1"/>
        <circle cx="170" cy="115" r="24" fill="#33CCFF" opacity="0.08"/>
        <circle cx="170" cy="115" r="16" fill="#33CCFF" opacity="0.06"/>
        <polygon points="78,232 118,178 158,232" fill="#1B2A22" opacity="0.06"/>
        <rect x="175" y="168" width="48" height="60" fill="#33CCFF" opacity="0.07"/>
    </g>
    <!-- Dense pixel grid -->
    <g clip-path="url(#ncCC)" stroke="#1B2A22" stroke-width="0.3" opacity="0.06">
        <line x1="42" y1="80" x2="237" y2="80"/><line x1="42" y1="100" x2="237" y2="100"/><line x1="42" y1="120" x2="237" y2="120"/>
        <line x1="42" y1="140" x2="237" y2="140"/><line x1="42" y1="160" x2="237" y2="160"/><line x1="42" y1="180" x2="237" y2="180"/>
        <line x1="42" y1="200" x2="237" y2="200"/><line x1="42" y1="220" x2="237" y2="220"/><line x1="42" y1="240" x2="237" y2="240"/>
        <line x1="62" y1="60" x2="62" y2="255"/><line x1="82" y1="60" x2="82" y2="255"/><line x1="102" y1="60" x2="102" y2="255"/>
        <line x1="122" y1="60" x2="122" y2="255"/><line x1="142" y1="60" x2="142" y2="255"/><line x1="162" y1="60" x2="162" y2="255"/>
        <line x1="182" y1="60" x2="182" y2="255"/><line x1="202" y1="60" x2="202" y2="255"/><line x1="222" y1="60" x2="222" y2="255"/>
    </g>
    <text x="139" y="275" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="10" font-weight="bold" opacity="0.7" text-anchor="middle">CONTENT INPUT</text>
    <text x="139" y="289" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="7" opacity="0.35" text-anchor="middle">256×256×3 float32</text>

    <!-- ===== RIGHT: STYLIZED OUTPUT (3D elevated panel) ===== -->
    <g filter="url(#ncLift)">
        <rect x="563" y="60" width="195" height="195" rx="6" fill="url(#ncOG)"/>
        <rect x="563" y="60" width="195" height="195" rx="6" fill="url(#ncPN)"/>
        <rect x="563" y="60" width="195" height="195" rx="6" fill="none" stroke="#FF5B62" stroke-width="1.8"/>
        <rect x="564" y="61" width="193" height="1" fill="#FFFFFF" opacity="0.5"/>
    </g>
    <!-- Reticle corners -->
    <path d="M 568 70 L 568 64 L 574 64" fill="none" stroke="#FF5B62" stroke-width="2" opacity="0.65"/>
    <path d="M 753 70 L 753 64 L 747 64" fill="none" stroke="#FF5B62" stroke-width="2" opacity="0.65"/>
    <path d="M 568 247 L 568 251 L 574 251" fill="none" stroke="#FF5B62" stroke-width="2" opacity="0.65"/>
    <path d="M 753 247 L 753 251 L 747 251" fill="none" stroke="#FF5B62" stroke-width="2" opacity="0.65"/>
    <!-- Output shapes — organic, painterly with depth -->
    <g clip-path="url(#ncOC)" opacity="0.65">
        <ellipse cx="615" cy="108" rx="52" ry="32" fill="#FF5B62" opacity="0.22" transform="rotate(-18 615 108)" filter="url(#ncG)"/>
        <ellipse cx="710" cy="152" rx="42" ry="58" fill="#F59E0B" opacity="0.18" transform="rotate(22 710 152)"/>
        <ellipse cx="638" cy="198" rx="58" ry="30" fill="#FF5B62" opacity="0.16" transform="rotate(-10 638 198)" filter="url(#ncG)"/>
        <ellipse cx="688" cy="108" rx="32" ry="45" fill="#F59E0B" opacity="0.12" transform="rotate(35 688 108)"/>
        <ellipse cx="595" cy="170" rx="25" ry="40" fill="#FF5B62" opacity="0.1" transform="rotate(-25 595 170)"/>
        <!-- Concentric rings for depth -->
        <circle cx="660" cy="155" r="42" fill="none" stroke="#FF5B62" stroke-width="1.5" opacity="0.15"/>
        <circle cx="660" cy="155" r="28" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.2"/>
        <circle cx="660" cy="155" r="15" fill="none" stroke="#FF5B62" stroke-width="0.8" opacity="0.15"/>
        <circle cx="660" cy="155" r="5" fill="#FF5B62" opacity="0.08"/>
        <!-- Brushstroke curves -->
        <path d="M 580 88 C 612 76, 648 118, 720 95" fill="none" stroke="#FF5B62" stroke-width="3" opacity="0.08" stroke-linecap="round"/>
        <path d="M 585 178 C 632 165, 688 198, 745 172" fill="none" stroke="#F59E0B" stroke-width="3.5" opacity="0.07" stroke-linecap="round"/>
        <path d="M 600 232 C 645 215, 698 242, 748 218" fill="none" stroke="#FF5B62" stroke-width="2.5" opacity="0.06" stroke-linecap="round"/>
    </g>
    <text x="660" y="275" fill="#FF5B62" font-family="'Share Tech Mono',monospace" font-size="10" font-weight="bold" text-anchor="middle">STYLIZED OUTPUT</text>
    <text x="660" y="289" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="7" opacity="0.35" text-anchor="middle">VGG-16 Perceptual Loss</text>

    <!-- ===== NEURAL PATHWAY CURVES ===== -->
    <g opacity="0.75">
        <path id="nP1" d="M 237 108 C 310 80, 365 65, 400 120 C 435 175, 498 85, 563 108" fill="none" stroke="url(#ncNF)" stroke-width="2"/>
        <path id="nP2" d="M 237 158 C 300 142, 338 190, 400 158 C 462 126, 502 195, 563 158" fill="none" stroke="url(#ncNF)" stroke-width="2.8"/>
        <path id="nP3" d="M 237 208 C 310 232, 365 248, 400 198 C 435 148, 498 232, 563 208" fill="none" stroke="url(#ncNF)" stroke-width="2"/>
        <!-- Animated particles -->
        <circle r="5" fill="#FF5B62" filter="url(#ncG)"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#nP1"/></animateMotion></circle>
        <circle r="5.5" fill="#1B2A22" opacity="0.8"><animateMotion dur="2.8s" repeatCount="indefinite" begin="0.5s"><mpath href="#nP2"/></animateMotion></circle>
        <circle r="5" fill="#33CCFF" filter="url(#ncG)"><animateMotion dur="2.5s" repeatCount="indefinite" begin="1s"><mpath href="#nP3"/></animateMotion></circle>
    </g>

    <!-- ===== CENTRAL PRISM (3D, volumetric) ===== -->
    <g transform="translate(400, 158)">
        <!-- Outer orbit -->
        <circle r="55" fill="none" stroke="#1B2A22" stroke-width="1" stroke-dasharray="5 9" opacity="0.2">
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
        </circle>
        <circle r="44" fill="none" stroke="#FF5B62" stroke-width="0.8" stroke-dasharray="3 7" opacity="0.15">
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite"/>
        </circle>
        <!-- Core node with 3D depth -->
        <circle r="36" fill="#1B2A22" opacity="0.03" transform="translate(2,3)"/>
        <circle r="36" fill="#F7F4EB" stroke="#1B2A22" stroke-width="2"/>
        <circle r="36" fill="none" stroke="#FF5B62" stroke-width="0.6" opacity="0.25"/>
        <!-- 3D Prism (layered triangles for depth) -->
        <polygon points="0,-22 19,12 -19,12" fill="#1B2A22" opacity="0.04" transform="translate(1.5,2)"/>
        <polygon points="0,-22 19,12 -19,12" fill="none" stroke="#FF5B62" stroke-width="3" stroke-linejoin="round"/>
        <polygon points="0,-22 19,12 -19,12" fill="#FF5B62" opacity="0.05"/>
        <!-- Inner prism detail -->
        <polygon points="0,-14 12,8 -12,8" fill="none" stroke="#F59E0B" stroke-width="0.8" opacity="0.3"/>
        <!-- Light beam IN -->
        <line x1="-32" y1="0" x2="-12" y2="0" stroke="#33CCFF" stroke-width="3" stroke-linecap="round" filter="url(#ncG)"/>
        <!-- Light dispersion OUT (volumetric beams) -->
        <line x1="12" y1="-6" x2="32" y2="-18" stroke="url(#ncBcoral)" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="12" y1="0" x2="32" y2="0" stroke="url(#ncBamber)" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="12" y1="6" x2="32" y2="18" stroke="url(#ncBcyan)" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Extended dispersion -->
        <line x1="32" y1="-18" x2="50" y2="-30" stroke="#FF5B62" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
        <line x1="32" y1="0" x2="50" y2="0" stroke="#F59E0B" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
        <line x1="32" y1="18" x2="50" y2="30" stroke="#33CCFF" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
        <!-- Prism glow -->
        <circle r="20" fill="#FF5B62" opacity="0.04" filter="url(#ncG2)"/>
        <!-- Labels -->
        <text x="0" y="62" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="8" font-weight="bold" opacity="0.6" text-anchor="middle" letter-spacing="1.5">INSTANCE NORM</text>
        <text x="0" y="74" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="7" opacity="0.35" text-anchor="middle">5× RESIDUAL BLOCKS</text>
    </g>

    <!-- ===== STYLE INPUT NODE ===== -->
    <g transform="translate(400, 42)" filter="url(#ncSh)">
        <rect x="-46" y="-14" width="92" height="28" rx="4" fill="url(#ncPN)" stroke="#FF5B62" stroke-width="1.5"/>
        <text x="0" y="5" fill="#FF5B62" font-family="'Share Tech Mono',monospace" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="1.5">STYLE TENSOR</text>
    </g>
    <line x1="400" y1="56" x2="400" y2="112" stroke="#FF5B62" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.5">
        <animate attributeName="stroke-dashoffset" values="8;0" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <text x="420" y="86" fill="#FF5B62" font-family="'Share Tech Mono',monospace" font-size="6" opacity="0.35" letter-spacing="0.5">GRAM MATRIX</text>

    <!-- ===== BOTTOM ARCHITECTURE STRIP (raised) ===== -->
    <g filter="url(#ncSh)">
        <rect x="0" y="335" width="800" height="65" fill="url(#ncPN)"/>
    </g>
    <rect x="0" y="334" width="800" height="1" fill="#1B2A22" opacity="0.12"/>
    <g transform="translate(400, 364)" font-family="'Share Tech Mono',monospace" font-size="8" fill="#1B2A22">
        <rect x="-370" y="-14" width="58" height="24" rx="3" fill="none" stroke="#1B2A22" stroke-width="0.8"/>
        <text x="-341" y="2" text-anchor="middle" font-weight="bold" letter-spacing="0.5">INPUT</text>
        <text x="-303" y="2" opacity="0.25" font-size="10">→</text>
        <rect x="-290" y="-14" width="52" height="24" rx="3" fill="none" stroke="#1B2A22" stroke-width="0.8"/>
        <text x="-264" y="2" text-anchor="middle" opacity="0.65">CONV↓</text>
        <text x="-230" y="2" opacity="0.25" font-size="10">→</text>
        <rect x="-218" y="-14" width="74" height="24" rx="3" fill="none" stroke="#FF5B62" stroke-width="1.5"/>
        <text x="-181" y="2" fill="#FF5B62" text-anchor="middle" font-weight="bold" letter-spacing="0.5">RESIDUAL</text>
        <text x="-137" y="2" opacity="0.25" font-size="10">→</text>
        <rect x="-124" y="-14" width="132" height="24" rx="3" fill="none" stroke="#1B2A22" stroke-width="1.2"/>
        <text x="-58" y="2" text-anchor="middle" font-weight="bold" letter-spacing="0.5">FEEDFORWARD STN</text>
        <text x="15" y="2" opacity="0.25" font-size="10">→</text>
        <rect x="28" y="-14" width="74" height="24" rx="3" fill="none" stroke="#FF5B62" stroke-width="1.5"/>
        <text x="65" y="2" fill="#FF5B62" text-anchor="middle" font-weight="bold" letter-spacing="0.5">RESIDUAL</text>
        <text x="109" y="2" opacity="0.25" font-size="10">→</text>
        <rect x="122" y="-14" width="52" height="24" rx="3" fill="none" stroke="#1B2A22" stroke-width="0.8"/>
        <text x="148" y="2" text-anchor="middle" opacity="0.65">CONV↑</text>
        <text x="181" y="2" opacity="0.25" font-size="10">→</text>
        <rect x="194" y="-14" width="62" height="24" rx="3" fill="none" stroke="#1B2A22" stroke-width="0.8"/>
        <text x="225" y="2" text-anchor="middle" font-weight="bold" letter-spacing="0.5">OUTPUT</text>
    </g>
    <text x="20" y="393" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="6" opacity="0.2" letter-spacing="1">PERCEPTUAL_LOSS_V2 // FEED_FORWARD_CNN</text>
    <text x="780" y="393" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="6" opacity="0.2" letter-spacing="1" text-anchor="end">ONNX_EXPORT_READY</text>
</svg>
