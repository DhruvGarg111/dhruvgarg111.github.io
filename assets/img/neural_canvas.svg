    </path>

    <!-- Content Box -->
    <g transform="translate(60, 40)">
        <rect x="0" y="0" width="180" height="110" rx="6" fill="#000" stroke="#1E293B" stroke-width="1.5"/>
        <rect x="0" y="0" width="180" height="110" rx="6" fill="url(#orange-fade)"/>
        
        <text x="12" y="20" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold">CONTENT_IMG [RAW]</text>
