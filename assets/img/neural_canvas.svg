        <path d="M 40 95 L 70 65 L 95 90 L 115 70 L 140 95" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
        <path d="M 40 95 L 70 65 L 95 90 L 115 70 L 140 95 L 140 95 L 40 95 Z" fill="#f59e0b" opacity="0.1"/>
    </g>

    <!-- Style Box -->
    <g transform="translate(60, 170)">
