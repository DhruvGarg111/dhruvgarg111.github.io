<svg viewBox="0 0 800 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="emeraldAura" cx="40%" cy="50%" r="65%">
            <stop offset="0%" stop-color="#064E3B" stop-opacity="0.9"/>
            <stop offset="60%" stop-color="#042F2E" stop-opacity="1"/>
            <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
        </radialGradient>
        
        <radialGradient id="cyanAura" cx="80%" cy="40%" r="55%">
            <stop offset="0%" stop-color="#0F766E"/>
            <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
        </radialGradient>

        <linearGradient id="neonCyan" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#2DD4BF"/>
            <stop offset="100%" stop-color="#10B981"/>
        </linearGradient>

        <linearGradient id="glassLinear" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
            <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
        </linearGradient>

        <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="12" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>

        <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="20" result="blur2"/>
            <feGaussianBlur stdDeviation="6" result="blur1"/>
            <feMerge>
                <feMergeNode in="blur2"/>
                <feMergeNode in="blur1"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <filter id="shadowHeavy" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#000" flood-opacity="1"/>
            <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#042F2E" flood-opacity="0.8"/>
        </filter>
        
        <pattern id="matrixPattern" width="120" height="24" patternUnits="userSpaceOnUse">
            <text x="5" y="18" fill="#10B981" font-family="monospace" font-size="12" opacity="0.15">01100101 01101110</text>
            <text x="75" y="18" fill="#34D399" font-family="monospace" font-size="12" opacity="0.08">SYS_OK</text>
        </pattern>
    </defs>

    <!-- Base Canvas -->
    <rect width="100%" height="100%" fill="url(#emeraldAura)"/>
    <rect width="100%" height="100%" fill="url(#cyanAura)" opacity="0.7"/>
    <rect width="100%" height="100%" fill="url(#matrixPattern)"/>

    <!-- Central Floating Dashboard -->
    <g transform="translate(150, 30)" filter="url(#shadowHeavy)">
        <rect width="500" height="80" rx="12" fill="url(#glassLinear)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.5" filter="url(#glassBlur)"/>
        
        <path d="M 0 12 C 0 5.3 5.3 0 12 0 L 488 0 C 494.6 0 500 5.3 500 12" fill="none" stroke="url(#neonCyan)" stroke-width="3" filter="url(#glowGreen)"/>
        
        <text x="250" y="38" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="8" text-anchor="middle">pygog CLI</text>
        <text x="250" y="60" fill="#6EE7B7" font-family="monospace" font-size="11" font-weight="600" letter-spacing="4" text-anchor="middle">GOOGLE IN YOUR TERMINAL</text>
        
        <circle cx="250" cy="74" r="4.5" fill="#10B981" filter="url(#glowGreen)">
            <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
        </circle>
    </g>

    <!-- Isometric Tech Routing Network -->
    <g transform="translate(420, 240) scale(1.4, 0.7) rotate(45)">
        
        <!-- Base Grid -->
        <rect x="-300" y="-300" width="600" height="600" fill="none" stroke="#6EE7B7" stroke-width="0.8" opacity="0.15"/>
        <line x1="0" y1="-300" x2="0" y2="300" stroke="#10B981" opacity="0.3"/>
        <line x1="-300" y1="0" x2="300" y2="0" stroke="#10B981" opacity="0.3"/>

        <!-- Abstract User Prompt Stream -->
        <path d="M -300 300 L 0 0" fill="none" stroke="#2DD4BF" stroke-width="6" stroke-dasharray="15 40" opacity="0.9" filter="url(#glowGreen)">
            <animate attributeName="stroke-dashoffset" values="55;0" dur="1s" repeatCount="indefinite"/>
        </path>
        <!-- Floating command strings alongside path -->
        <g transform="translate(-150, 150) rotate(-45)">
             <text x="0" y="0" fill="#A7F3D0" font-family="monospace" font-size="10" font-weight="900" letter-spacing="1">ask "Find Q4 Report"</text>
             <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/>
        </g>

        <!-- THE AGENT CORE (Center) -->
        <g transform="translate(0, 0)">
            <rect x="-50" y="-50" width="100" height="100" fill="url(#glassLinear)" stroke="#34D399" stroke-width="3" filter="url(#shadowHeavy)"/>
            <polygon points="-25,0 0,-25 25,0 0,25" fill="url(#neonCyan)" filter="url(#glowGreen)">
                 <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
            </polygon>
            <circle cx="0" cy="0" r="7" fill="#fff" filter="url(#glowGreen)"/>
            
            <circle cx="-35" cy="-35" r="10" fill="#38BDF8" filter="url(#glowGreen)"/>
            <circle cx="35" cy="-35" r="10" fill="#A78BFA" filter="url(#glowGreen)"/>
            <circle cx="35" cy="35" r="10" fill="#F43F5E" filter="url(#glowGreen)"/>
        </g>

        <!-- Router Beams out to APIs -->
        <path d="M 0 0 L 180 -180" fill="none" stroke="url(#neonCyan)" stroke-width="3" filter="url(#glowGreen)"/>
        <circle cx="180" cy="-180" r="4.5" fill="#FFF">
             <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
        </circle>

        <path d="M 0 0 L 220 0" fill="none" stroke="url(#neonCyan)" stroke-width="3" filter="url(#glowGreen)"/>
        <circle cx="220" cy="0" r="4.5" fill="#FFF">
            <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/>
        </circle>

        <!-- API TARGET 1 (Gmail/Drive) -->
        <g transform="translate(180, -180)">
            <rect x="-35" y="-35" width="70" height="70" fill="url(#glassLinear)" stroke="#F87171" stroke-width="2.5" filter="url(#shadowHeavy)"/>
            <circle cx="0" cy="0" r="12" fill="#EF4444" filter="url(#glowGreen)"/>
        </g>

        <!-- API TARGET 2 (Calendar/Tasks) -->
        <g transform="translate(220, 0)">
            <rect x="-35" y="-35" width="70" height="70" fill="url(#glassLinear)" stroke="#38BDF8" stroke-width="2.5" filter="url(#shadowHeavy)"/>
            <circle cx="0" cy="0" r="12" fill="#0EA5E9" filter="url(#glowGreen)"/>
        </g>
    </g>

    <!-- Solid Background Tech Specs Floating in Space -->
    <g transform="translate(40, 200)" filter="url(#shadowHeavy)">
        <rect width="200" height="60" rx="6" fill="#020617" stroke="#047857" stroke-width="1.5" opacity="0.9"/>
        <text x="15" y="25" fill="#10B981" font-family="monospace" font-size="12" font-weight="900" letter-spacing="2">INPUT_CMD</text>
        <text x="15" y="45" fill="#A7F3D0" font-family="monospace" font-size="10" letter-spacing="1">NATURAL LANG PROMPT</text>
    </g>
    
    <g transform="translate(40, 310)" filter="url(#shadowHeavy)">
        <rect width="200" height="60" rx="6" fill="#020617" stroke="#6D28D9" stroke-width="1.5" opacity="0.9"/>
        <text x="15" y="25" fill="#A78BFA" font-family="monospace" font-size="12" font-weight="900" letter-spacing="2">OS_KEYRING</text>
        <text x="15" y="45" fill="#E9D5FF" font-family="monospace" font-size="10" letter-spacing="1">SECURE OAUTH TOKENS</text>
    </g>

    <g transform="translate(560, 200)" filter="url(#shadowHeavy)">
        <rect width="200" height="60" rx="6" fill="#020617" stroke="#991B1B" stroke-width="1.5" opacity="0.9"/>
        <text x="185" y="25" fill="#F87171" font-family="monospace" font-size="12" font-weight="900" letter-spacing="2" text-anchor="end">GMAIL :: DRIVE</text>
        <text x="185" y="45" fill="#FECACA" font-family="monospace" font-size="10" letter-spacing="1" text-anchor="end">REST API EXECUTION</text>
    </g>

    <g transform="translate(560, 310)" filter="url(#shadowHeavy)">
        <rect width="200" height="60" rx="6" fill="#020617" stroke="#075985" stroke-width="1.5" opacity="0.9"/>
        <text x="185" y="25" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="900" letter-spacing="2" text-anchor="end">CAL :: TASKS</text>
        <text x="185" y="45" fill="#E0F2FE" font-family="monospace" font-size="10" letter-spacing="1" text-anchor="end">JSON PAYLOAD OVER HTTP</text>
    </g>

    <g transform="translate(350, 370)">
        <text x="50" y="0" fill="#A7F3D0" font-family="monospace" font-size="10" font-weight="900" letter-spacing="2" text-anchor="middle">LLM NEURAL ROUTER</text>
        <path d="M 0 -12 L 50 -5 L 100 -12" fill="none" stroke="#10B981" stroke-width="1.5"/>
    </g>

    <g stroke="#10B981" stroke-width="2" fill="none">
        <path d="M 30 50 L 30 30 L 50 30"/>
        <path d="M 770 50 L 770 30 L 750 30"/>
        <path d="M 30 350 L 30 370 L 50 370"/>
        <path d="M 770 350 L 770 370 L 750 370"/>
    </g>
</svg>
