<svg viewBox="0 0 800 320" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="glow-emerald" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="glow-teal" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <linearGradient id="emerald-fade" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#10B981" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#064E3B" stop-opacity="0.05"/>
        </linearGradient>
        <linearGradient id="green-fade" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#34D399" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#022C22" stop-opacity="0.05"/>
        </linearGradient>
        <linearGradient id="teal-fade" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#134E4A" stop-opacity="0.05"/>
        </linearGradient>        
        <pattern id="hex-bg" width="40" height="69.28" patternUnits="userSpaceOnUse" patternTransform="scale(0.5)">
            <path d="M20 0 L40 11.55 L40 34.64 L20 46.19 L0 34.64 L0 11.55 Z" fill="none" stroke="#1E293B" stroke-width="1.5" opacity="0.4"/>
            <path d="M20 69.28 L40 57.74 L40 34.64 L20 46.19 L0 34.64 L0 57.74 Z" fill="none" stroke="#1E293B" stroke-width="1.5" opacity="0.4"/>
        </pattern>
        <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#020617"/>
            <stop offset="100%" stop-color="#0F172A"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="url(#bg-grad)"/>
    <rect width="100%" height="100%" fill="url(#hex-bg)"/>

    <!-- Flow Paths -->
    <path d="M 280 100 C 330 100, 310 160, 360 160" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="6 6">
        <animate attributeName="stroke-dashoffset" values="24;0" dur="1.5s" repeatCount="indefinite" />
    </path>
    <path d="M 520 160 C 560 160, 560 100, 600 100" fill="none" stroke="#34D399" stroke-width="2" stroke-dasharray="6 6">
        <animate attributeName="stroke-dashoffset" values="24;0" dur="1.5s" repeatCount="indefinite" />
    </path>
    <path d="M 520 160 C 560 160, 560 220, 600 220" fill="none" stroke="#14B8A6" stroke-width="2" stroke-dasharray="6 6">
        <animate attributeName="stroke-dashoffset" values="24;0" dur="1.5s" repeatCount="indefinite" />
    </path>

    <!-- Block 1: Terminal CLI -->
    <g transform="translate(60, 40)">
        <rect x="0" y="0" width="220" height="180" rx="6" fill="#000" stroke="#1E293B" stroke-width="1.5"/>
        <rect x="0" y="0" width="220" height="180" rx="6" fill="url(#green-fade)"/>
        
        <rect x="0" y="0" width="220" height="24" rx="6" fill="#0F172A"/>
        <line x1="0" y1="24" x2="220" y2="24" stroke="#1E293B" stroke-width="1.5"/>
        
        <circle cx="16" cy="12" r="4" fill="#EF4444"/>
        <circle cx="28" cy="12" r="4" fill="#F59E0B"/>
        <circle cx="40" cy="12" r="4" fill="#10B981"/>
        <text x="110" y="16" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">pygog ~ client</text>
        
        <!-- Terminal Body -->
        <g transform="translate(16, 45)">
            <text x="0" y="10" fill="#E2E8F0" font-size="10" font-family="monospace">&gt; pygog do "Draft reply</text>
            <text x="14" y="24" fill="#E2E8F0" font-size="10" font-family="monospace">for repo access request"</text>
            <text x="0" y="44" fill="#94A3B8" font-size="10" font-family="monospace">[core] routing module...</text>
            <text x="0" y="60" fill="#10B981" font-size="10" font-family="monospace">- Dispatching to LLM</text>
            <text x="0" y="76" fill="#10B981" font-size="10" font-family="monospace">- Connecting to APIs</text>
            <!-- Cursor -->
            <rect x="0" y="90" width="8" height="14" fill="#10B981">
                <animate attributeName="opacity" values="1;0" dur="0.8s" repeatCount="indefinite" />
            </rect>
        </g>
    </g>

    <!-- Block 2: Agent Core -->
    <g transform="translate(360, 100)">
        <rect x="0" y="0" width="160" height="120" rx="6" fill="#000" stroke="#1E293B" stroke-width="1.5"/>
        <rect x="0" y="0" width="160" height="120" rx="6" fill="url(#emerald-fade)"/>
        <rect x="0" y="0" width="160" height="120" rx="6" fill="none" stroke="#10B981" stroke-width="1.5" filter="url(#glow-emerald)" opacity="0.6"/>
        
        <text x="12" y="20" fill="#10B981" font-family="monospace" font-size="10" font-weight="bold">AGENT_CORE Node</text>
        <line x1="0" y1="28" x2="160" y2="28" stroke="#1E293B" stroke-width="1.5"/>
        
        <!-- Nodes Representation -->
        <g transform="translate(80, 65)">
            <circle cx="0" cy="0" r="14" fill="none" stroke="#10B981" stroke-width="2" filter="url(#glow-emerald)"/>
            <circle cx="0" cy="0" r="4" fill="#34D399"/>
            
            <circle cx="-30" cy="15" r="4" fill="#059669"/>
            <circle cx="30" cy="15" r="4" fill="#059669"/>
            <circle cx="0" cy="-25" r="4" fill="#059669"/>
            
            <line x1="0" y1="0" x2="-30" y2="15" stroke="#10B981" stroke-width="1.5" opacity="0.5"/>
            <line x1="0" y1="0" x2="30" y2="15" stroke="#10B981" stroke-width="1.5" opacity="0.5"/>
            <line x1="0" y1="0" x2="0" y2="-25" stroke="#10B981" stroke-width="1.5" opacity="0.5"/>
            
            <text x="0" y="35" fill="#10B981" font-size="9" font-family="monospace" text-anchor="middle" font-weight="bold">GEMINI // OPENAI</text>
        </g>
    </g>

    <!-- Block 3: Google APIs -->
    <g transform="translate(600, 40)">
        <rect x="0" y="0" width="160" height="100" rx="6" fill="#000" stroke="#1E293B" stroke-width="1.5"/>
        <rect x="0" y="0" width="160" height="100" rx="6" fill="url(#green-fade)"/>
        
        <text x="12" y="20" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold">WORKSPACE_API</text>
        <line x1="0" y1="28" x2="160" y2="28" stroke="#1E293B" stroke-width="1.5"/>
        
        <g transform="translate(25, 45)">
            <rect x="0" y="0" width="30" height="20" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>
            <polyline points="0,0 15,10 30,0" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>
            <text x="15" y="32" fill="#E2E8F0" font-size="8" font-family="sans-serif" text-anchor="middle">Gmail</text>
        </g>
        
        <g transform="translate(100, 45)">
            <rect x="0" y="0" width="30" height="20" rx="3" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
            <line x1="0" y1="6" x2="30" y2="6" stroke="#38BDF8" stroke-width="1.5"/>
            <text x="15" y="32" fill="#38BDF8" font-size="8" font-family="sans-serif" text-anchor="middle">Calendar</text>
        </g>
    </g>

    <!-- Block 4: System Action Executed -->
    <g transform="translate(600, 160)">
        <rect x="0" y="0" width="160" height="100" rx="6" fill="#000" stroke="#1E293B" stroke-width="1.5"/>
        <rect x="0" y="0" width="160" height="100" rx="6" fill="url(#teal-fade)"/>
        
        <text x="12" y="20" fill="#14B8A6" font-family="monospace" font-size="10" font-weight="bold">TASK_EXEC</text>
        <line x1="0" y1="28" x2="160" y2="28" stroke="#1E293B" stroke-width="1.5"/>
        
        <g transform="translate(80, 55)">
            <circle cx="0" cy="0" r="16" fill="none" stroke="#14B8A6" stroke-width="2" filter="url(#glow-teal)"/>
            <polyline points="-6,0 -2,4 6,-4" fill="none" stroke="#E2E8F0" stroke-width="2.5"/>
            
            <circle cx="0" cy="0" r="24" fill="none" stroke="#14B8A6" stroke-width="1" opacity="0.3"/>
            <text x="0" y="28" fill="#14B8A6" font-size="9" font-family="monospace" text-anchor="middle" font-weight="bold">SUCCESS</text>
        </g>
    </g>

    <!-- Telemetry Bar -->
    <text x="30" y="310" fill="#475569" font-size="10" font-family="monospace" letter-spacing="1">STATUS :: 🟢 SYS.RDY</text>
    <text x="590" y="310" fill="#475569" font-size="10" font-family="monospace" letter-spacing="1">TOKENS: OK | AUTH: VALID</text>
</svg>
