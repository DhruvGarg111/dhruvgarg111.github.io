<svg viewBox="0 0 800 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="pgG" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="pgG2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="pgSh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#1B2A22" flood-opacity="0.12"/></filter>
        <filter id="pgLift" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="4" dy="6" stdDeviation="8" flood-color="#1B2A22" flood-opacity="0.22"/></filter>
        <filter id="pgDeep" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="5" dy="8" stdDeviation="12" flood-color="#1B2A22" flood-opacity="0.28"/></filter>
        <radialGradient id="pgRG" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FF5B62" stop-opacity="0.14"/><stop offset="60%" stop-color="#FF5B62" stop-opacity="0.04"/><stop offset="100%" stop-color="#F7F4EB" stop-opacity="0"/></radialGradient>
        <linearGradient id="pgPN" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F7F4EB" stop-opacity="0.97"/><stop offset="100%" stop-color="#EAE6D9" stop-opacity="0.9"/></linearGradient>
        <linearGradient id="pgTermBG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F7F4EB" stop-opacity="0.98"/><stop offset="100%" stop-color="#EDE9DF" stop-opacity="0.95"/></linearGradient>
    </defs>

    <rect width="800" height="400" fill="none"/>

    <!-- Subtle convergence lines -->
    <g opacity="0.015" stroke="#1B2A22" stroke-width="0.4">
        <line x1="0" y1="400" x2="500" y2="0"/><line x1="200" y1="400" x2="600" y2="0"/>
        <line x1="400" y1="400" x2="700" y2="0"/><line x1="600" y1="400" x2="800" y2="0"/>
    </g>

    <!-- ===== TERMINAL WINDOW (deep 3D shadow) ===== -->
    <g filter="url(#pgDeep)">
        <g transform="translate(18, 14)">
            <!-- Window frame with 3D layers -->
            <rect width="462" height="345" rx="8" fill="#1B2A22" opacity="0.04" transform="translate(4,5)"/>
            <rect width="462" height="345" rx="8" fill="url(#pgTermBG)" stroke="#1B2A22" stroke-width="1.5" opacity="0.95"/>
            <!-- Top edge highlight -->
            <rect x="1" y="1" width="460" height="1" fill="#FFFFFF" opacity="0.6" rx="1"/>
            <!-- Title bar with depth -->
            <rect width="462" height="32" rx="8" fill="#1B2A22" fill-opacity="0.04"/>
            <rect y="24" width="462" height="8" fill="#1B2A22" fill-opacity="0.04"/>
            <line x1="0" y1="32" x2="462" y2="32" stroke="#1B2A22" stroke-width="1" opacity="0.1"/>
            <!-- Traffic lights (3D raised) -->
            <circle cx="20" cy="16" r="6" fill="#FF5B62"/>
            <circle cx="20" cy="16" r="4" fill="#FF5B62" opacity="0.7" transform="translate(-0.5,-0.5)"/>
            <circle cx="38" cy="16" r="6" fill="#F59E0B"/>
            <circle cx="38" cy="16" r="4" fill="#F59E0B" opacity="0.7" transform="translate(-0.5,-0.5)"/>
            <circle cx="56" cy="16" r="6" fill="#33CCFF"/>
            <circle cx="56" cy="16" r="4" fill="#33CCFF" opacity="0.7" transform="translate(-0.5,-0.5)"/>
            <text x="231" y="20" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="10" font-weight="bold" opacity="0.5" text-anchor="middle" letter-spacing="0.5">pygog — bash</text>

            <!-- Terminal content -->
            <g font-family="'Share Tech Mono',monospace" transform="translate(22, 52)">
                <text y="0" fill="#1B2A22" font-size="9" opacity="0.3">~/projects/pygog</text>
                <text y="20" fill="#1B2A22" font-size="12" font-weight="bold">❯ <tspan fill="#FF5B62">pygog ask</tspan> "find my Q4 revenue report"</text>
                <text y="42" fill="#1B2A22" font-size="9" opacity="0.4">⠋ routing query through gemini-1.5-flash...</text>
                <text y="64" fill="#1B2A22" font-size="9" font-weight="bold" opacity="0.65">✓ Intent parsed  <tspan opacity="0.2">───────</tspan> <tspan fill="#FF5B62">search_drive</tspan></text>
                <text y="80" fill="#1B2A22" font-size="9" font-weight="bold" opacity="0.65">✓ API resolved   <tspan opacity="0.2">───────</tspan> drive.files.list</text>
                <text y="96" fill="#1B2A22" font-size="9" font-weight="bold" opacity="0.65">✓ OAuth token    <tspan opacity="0.2">───────</tspan> oauth_token_cached</text>
                <!-- Separator with glow effect -->
                <text y="118" fill="#1B2A22" font-size="9" opacity="0.25">─── Query Results ────────────────────────────</text>
                <!-- Results with subtle hover-like highlight bg -->
                <rect x="-4" y="125" width="420" height="30" fill="#33CCFF" opacity="0.015" rx="2"/>
                <text y="140" fill="#1B2A22" font-size="11" font-weight="bold">  1  Q4_Revenue_Final.xlsx</text>
                <text y="154" fill="#1B2A22" font-size="8" opacity="0.4">     Dec 15, 2024 · 2.4 MB · <tspan fill="#FF5B62" font-weight="bold">shared</tspan></text>
                <rect x="-4" y="161" width="420" height="30" fill="#1B2A22" opacity="0.008" rx="2"/>
                <text y="176" fill="#1B2A22" font-size="11" font-weight="bold">  2  Q4_Revenue_Draft.docx</text>
                <text y="190" fill="#1B2A22" font-size="8" opacity="0.4">     Dec 10, 2024 · 840 KB · private</text>
                <rect x="-4" y="197" width="420" height="30" fill="#33CCFF" opacity="0.015" rx="2"/>
                <text y="212" fill="#1B2A22" font-size="11" font-weight="bold">  3  Revenue_Q4_Slides.pptx</text>
                <text y="226" fill="#1B2A22" font-size="8" opacity="0.4">     Dec 18, 2024 · 5.1 MB · <tspan fill="#FF5B62" font-weight="bold">shared</tspan></text>
                <text y="252" fill="#1B2A22" font-size="8" opacity="0.3">3 results resolved in 142ms</text>
                <text y="278" fill="#1B2A22" font-size="12" font-weight="bold">❯ <tspan opacity="0.3">_</tspan></text>
                <rect x="22" y="266" width="9" height="15" fill="#1B2A22" opacity="0.7">
                    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.1s" repeatCount="indefinite"/>
                </rect>
            </g>
            <!-- Line numbers gutter -->
            <g font-family="'Share Tech Mono',monospace" font-size="7" fill="#1B2A22" opacity="0.1" transform="translate(8, 52)">
                <text y="0">01</text><text y="20">02</text><text y="42">03</text><text y="64">04</text>
                <text y="80">05</text><text y="96">06</text><text y="118">07</text><text y="140">08</text>
                <text y="176">09</text><text y="212">10</text><text y="252">11</text><text y="278">12</text>
            </g>
        </g>
    </g>

    <!-- ===== CENTRAL LLM ROUTER NODE (big, 3D) ===== -->
    <circle cx="612" cy="145" r="90" fill="url(#pgRG)" filter="url(#pgG2)"/>
    <g transform="translate(612, 145)">
        <!-- Outer orbits -->
        <circle r="52" fill="none" stroke="#1B2A22" stroke-width="1" stroke-dasharray="5 10" opacity="0.18">
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
        </circle>
        <circle r="42" fill="none" stroke="#FF5B62" stroke-width="0.8" stroke-dasharray="3 8" opacity="0.15">
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="15s" repeatCount="indefinite"/>
        </circle>
        <!-- Core with 3D depth -->
        <circle r="33" fill="#1B2A22" opacity="0.04" transform="translate(2,3)"/>
        <circle r="33" fill="#F7F4EB" stroke="#1B2A22" stroke-width="2.2"/>
        <circle r="33" fill="none" stroke="#FF5B62" stroke-width="0.6" opacity="0.25"/>
        <circle r="22" fill="none" stroke="#1B2A22" stroke-width="0.3" opacity="0.08"/>
        <!-- Neural net icon (3D-ish connected nodes) -->
        <circle cx="-10" cy="-10" r="5" fill="#FF5B62"/>
        <circle cx="-10" cy="-10" r="3.5" fill="#FF5B62" opacity="0.5" transform="translate(-0.5,-0.5)"/>
        <circle cx="10" cy="-10" r="5" fill="#33CCFF"/>
        <circle cx="10" cy="-10" r="3.5" fill="#33CCFF" opacity="0.5" transform="translate(-0.5,-0.5)"/>
        <circle cx="0" cy="10" r="5" fill="#1B2A22"/>
        <line x1="-10" y1="-10" x2="0" y2="10" stroke="#1B2A22" stroke-width="1.5" opacity="0.3"/>
        <line x1="10" y1="-10" x2="0" y2="10" stroke="#1B2A22" stroke-width="1.5" opacity="0.3"/>
        <line x1="-10" y1="-10" x2="10" y2="-10" stroke="#1B2A22" stroke-width="1.5" opacity="0.3"/>
        <!-- Labels -->
        <text x="0" y="57" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1.5">LLM ROUTER</text>
        <text x="0" y="70" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="7" opacity="0.4" text-anchor="middle">gemini-1.5-flash</text>
    </g>

    <!-- ===== CONNECTION: Terminal → Router (animated) ===== -->
    <path id="pgTR" d="M 480 155 C 525 155, 545 145, 572 145" fill="none" stroke="#FF5B62" stroke-width="2.8" opacity="0.55"/>
    <circle r="5" fill="#FF5B62" filter="url(#pgG)">
        <animateMotion dur="1.5s" repeatCount="indefinite"><mpath href="#pgTR"/></animateMotion>
    </circle>

    <!-- ===== API SERVICE CARDS (3D raised, with depth stacking) ===== -->
    <!-- Gmail -->
    <g transform="translate(688, 24)" filter="url(#pgSh)">
        <rect width="98" height="46" rx="5" fill="url(#pgPN)"/>
        <rect width="98" height="46" rx="5" fill="none" stroke="#1B2A22" stroke-width="1" opacity="0.15"/>
        <rect x="1" y="1" width="96" height="1" fill="#FFFFFF" opacity="0.4" rx="1"/>
        <rect width="4" height="46" rx="2" fill="#FF5B62"/>
        <text x="16" y="19" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="9" font-weight="bold" letter-spacing="0.5">GMAIL API</text>
        <text x="16" y="33" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="6.5" opacity="0.4">users.messages</text>
    </g>
    <path d="M 710 70 L 640 112" fill="none" stroke="#FF5B62" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.25"/>

    <!-- Drive -->
    <g transform="translate(700, 82)" filter="url(#pgSh)">
        <rect width="90" height="46" rx="5" fill="url(#pgPN)"/>
        <rect width="90" height="46" rx="5" fill="none" stroke="#1B2A22" stroke-width="1" opacity="0.15"/>
        <rect x="1" y="1" width="88" height="1" fill="#FFFFFF" opacity="0.4" rx="1"/>
        <rect width="4" height="46" rx="2" fill="#F59E0B"/>
        <text x="16" y="19" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="9" font-weight="bold" letter-spacing="0.5">DRIVE API</text>
        <text x="16" y="33" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="6.5" opacity="0.4">files.list</text>
    </g>
    <path d="M 700 110 L 652 132" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.25"/>

    <!-- Calendar -->
    <g transform="translate(708, 174)" filter="url(#pgSh)">
        <rect width="84" height="46" rx="5" fill="url(#pgPN)"/>
        <rect width="84" height="46" rx="5" fill="none" stroke="#1B2A22" stroke-width="1" opacity="0.15"/>
        <rect x="1" y="1" width="82" height="1" fill="#FFFFFF" opacity="0.4" rx="1"/>
        <rect width="4" height="46" rx="2" fill="#33CCFF"/>
        <text x="16" y="19" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="9" font-weight="bold" letter-spacing="0.5">CALENDAR</text>
        <text x="16" y="33" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="6.5" opacity="0.4">events.list</text>
    </g>
    <path d="M 708 197 L 658 162" fill="none" stroke="#33CCFF" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.25"/>

    <!-- Tasks -->
    <g transform="translate(694, 250)" filter="url(#pgSh)">
        <rect width="86" height="46" rx="5" fill="url(#pgPN)"/>
        <rect width="86" height="46" rx="5" fill="none" stroke="#1B2A22" stroke-width="1" opacity="0.15"/>
        <rect x="1" y="1" width="84" height="1" fill="#FFFFFF" opacity="0.4" rx="1"/>
        <rect width="4" height="46" rx="2" fill="#1B2A22" opacity="0.5"/>
        <text x="16" y="19" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="9" font-weight="bold" letter-spacing="0.5">TASKS API</text>
        <text x="16" y="33" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="6.5" opacity="0.4">tasks.list</text>
    </g>
    <path d="M 694 273 L 645 185" fill="none" stroke="#1B2A22" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.15"/>

    <!-- ===== OS KEYRING (raised badge) ===== -->
    <g transform="translate(598, 310)" filter="url(#pgSh)">
        <rect width="125" height="44" rx="5" fill="url(#pgPN)"/>
        <rect width="125" height="44" rx="5" fill="none" stroke="#1B2A22" stroke-width="1" opacity="0.15"/>
        <rect x="1" y="1" width="123" height="1" fill="#FFFFFF" opacity="0.4" rx="1"/>
        <rect width="4" height="44" rx="2" fill="#FF5B62"/>
        <text x="16" y="18" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="8" font-weight="bold" letter-spacing="0.5">OS KEYRING</text>
        <text x="16" y="32" fill="#1B2A22" font-family="'Share Tech Mono',monospace" font-size="6.5" opacity="0.4">AES-256 Auth Storage</text>
        <!-- Lock icon -->
        <rect x="102" y="12" width="12" height="10" rx="2" fill="none" stroke="#FF5B62" stroke-width="1.2"/>
        <path d="M 105 12 L 105 8 A 3 3 0 0 1 111 8 L 111 12" fill="none" stroke="#FF5B62" stroke-width="1.2"/>
    </g>
    <line x1="648" y1="310" x2="630" y2="220" stroke="#1B2A22" stroke-width="1" stroke-dasharray="2 4" opacity="0.15"/>

    <!-- ===== BOTTOM FLOW STRIP (raised) ===== -->
    <g filter="url(#pgSh)">
        <rect x="0" y="372" width="800" height="28" fill="url(#pgPN)"/>
    </g>
    <rect x="0" y="371" width="800" height="1" fill="#1B2A22" opacity="0.12"/>
    <g transform="translate(400, 389)" font-family="'Share Tech Mono',monospace" font-size="8" fill="#1B2A22" opacity="0.55" text-anchor="middle" letter-spacing="1">
        <text><tspan fill="#FF5B62" font-weight="bold">STDIN</tspan> → TOKENIZE → <tspan fill="#FF5B62" font-weight="bold">LLM ROUTE</tspan> → <tspan fill="#33CCFF" font-weight="bold">GOOGLE API</tspan> → FORMAT → STDOUT</text>
    </g>
</svg>
