<svg viewBox="0 0 800 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="bg" cx="50%" cy="50%" r="75%">
            <stop offset="0%" stop-color="#051A12"/>
            <stop offset="100%" stop-color="#010A06"/>
        </radialGradient>
        <radialGradient id="routerGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#10B981" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#000" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="crtSheen" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#34D399" stop-opacity="0.04"/>
            <stop offset="50%" stop-color="#34D399" stop-opacity="0"/>
            <stop offset="100%" stop-color="#34D399" stop-opacity="0.02"/>
        </linearGradient>
        <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="gb" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="10"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.85"/>
        </filter>
        <!-- CRT scanline pattern -->
        <pattern id="crt" width="800" height="3" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="800" y2="0" stroke="#34D399" stroke-width="0.4" opacity="0.03"/>
        </pattern>
        <clipPath id="termClip"><rect x="2" y="28" width="466" height="312" rx="6"/></clipPath>
    </defs>

    <rect width="800" height="400" fill="url(#bg)"/>

    <!-- ===== TERMINAL WINDOW (Left 60%) ===== -->
    <g transform="translate(20, 20)" filter="url(#sh)">
        <!-- Window frame -->
        <rect width="470" height="342" rx="8" fill="#080F0C" stroke="#1A3A2A" stroke-width="1.5"/>
        <!-- Title bar -->
        <rect width="470" height="28" rx="8" fill="#0C1A14"/>
        <rect y="16" width="470" height="12" fill="#0C1A14"/>
        <!-- Traffic lights -->
        <circle cx="16" cy="14" r="5.5" fill="#EF4444" opacity="0.75"/>
        <circle cx="34" cy="14" r="5.5" fill="#F59E0B" opacity="0.75"/>
        <circle cx="52" cy="14" r="5.5" fill="#34D399" opacity="0.75"/>
        <text x="235" y="18" fill="#475569" font-family="monospace" font-size="10" text-anchor="middle">pygog — zsh</text>

        <!-- CRT overlay -->
        <g clip-path="url(#termClip)">
            <rect x="0" y="28" width="470" height="314" fill="url(#crt)"/>
            <rect x="0" y="28" width="470" height="314" fill="url(#crtSheen)"/>
        </g>

        <!-- Terminal content -->
        <g font-family="monospace" transform="translate(18, 50)">
            <text y="0" fill="#475569" font-size="10">~/projects</text>
            <text y="18" fill="#34D399" font-size="12">❯ <tspan fill="#FFF">pygog ask</tspan> <tspan fill="#6EE7B7">"find my Q4 revenue report"</tspan></text>

            <text y="40" fill="#475569" font-size="10">⠋ routing through gemini-1.5-flash...</text>

            <text y="62" fill="#10B981" font-size="10">✓ <tspan fill="#A7F3D0">Intent parsed  </tspan><tspan fill="#475569">────────</tspan><tspan fill="#FFF"> search_drive</tspan></text>
            <text y="78" fill="#10B981" font-size="10">✓ <tspan fill="#A7F3D0">API resolved   </tspan><tspan fill="#475569">────────</tspan><tspan fill="#FFF"> drive.files.list</tspan></text>
            <text y="94" fill="#10B981" font-size="10">✓ <tspan fill="#A7F3D0">OAuth token    </tspan><tspan fill="#475569">────────</tspan><tspan fill="#FFF"> ••••••7f2a</tspan></text>
            <text y="110" fill="#10B981" font-size="10">✓ <tspan fill="#A7F3D0">Query built    </tspan><tspan fill="#475569">────────</tspan><tspan fill="#FFF"> q4 revenue report</tspan></text>

            <text y="134" fill="#475569" font-size="10">─── Results ───────────────────────────────────</text>

            <text y="156" fill="#38BDF8" font-size="11">  1  <tspan fill="#E0F2FE">Q4_Revenue_Final.xlsx</tspan></text>
            <text y="172" fill="#475569" font-size="9">     Dec 15, 2024 · 2.4 MB · <tspan fill="#34D399">shared</tspan></text>

            <text y="194" fill="#38BDF8" font-size="11">  2  <tspan fill="#E0F2FE">Q4_Revenue_Draft.docx</tspan></text>
            <text y="210" fill="#475569" font-size="9">     Dec 10, 2024 · 840 KB · <tspan fill="#A78BFA">private</tspan></text>

            <text y="232" fill="#38BDF8" font-size="11">  3  <tspan fill="#E0F2FE">Revenue_Q4_Slides.pptx</tspan></text>
            <text y="248" fill="#475569" font-size="9">     Dec 18, 2024 · 5.1 MB · <tspan fill="#34D399">shared</tspan></text>

            <text y="274" fill="#475569" font-size="9">3 results · 142ms · 1 API call</text>

            <text y="298" fill="#34D399" font-size="12">❯ <tspan fill="#475569">_</tspan></text>
            <!-- Blinking cursor -->
            <rect x="22" y="288" width="8" height="14" fill="#34D399">
                <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
            </rect>
        </g>
    </g>

    <!-- ===== RIGHT SIDE: ARCHITECTURE DIAGRAM ===== -->
    <!-- Central LLM Router -->
    <circle cx="620" cy="140" r="80" fill="url(#routerGlow)"/>
    <g transform="translate(620, 140)">
        <!-- Outer animated ring -->
        <circle r="42" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="6 10" opacity="0.4">
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
        </circle>
        <!-- Core -->
        <circle r="32" fill="#0A1A12" stroke="#34D399" stroke-width="2.5"/>
        <!-- Neural net icon inside -->
        <circle cx="-10" cy="-10" r="4" fill="#34D399" opacity="0.7"/>
        <circle cx="10" cy="-10" r="4" fill="#34D399" opacity="0.7"/>
        <circle cx="0" cy="10" r="4" fill="#34D399" opacity="0.7"/>
        <line x1="-10" y1="-10" x2="0" y2="10" stroke="#34D399" stroke-width="1" opacity="0.5"/>
        <line x1="10" y1="-10" x2="0" y2="10" stroke="#34D399" stroke-width="1" opacity="0.5"/>
        <line x1="-10" y1="-10" x2="10" y2="-10" stroke="#34D399" stroke-width="1" opacity="0.5"/>
        <!-- Label -->
        <text x="0" y="55" fill="#A7F3D0" font-family="monospace" font-size="9" font-weight="bold" letter-spacing="1" text-anchor="middle">LLM ROUTER</text>
        <text x="0" y="67" fill="#475569" font-family="monospace" font-size="7" text-anchor="middle">gemini-1.5-flash</text>
    </g>

    <!-- Connection: Terminal → Router -->
    <path d="M 490 155 C 530 155, 550 140, 578 140" fill="none" stroke="#34D399" stroke-width="3" filter="url(#g)" opacity="0.7"/>
    <!-- Animated pulse -->
    <circle r="4" fill="#FFF" filter="url(#g)">
        <animate attributeName="cx" values="490;578" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="155;140" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.2" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- ===== API SERVICE CARDS ===== -->
    <!-- Gmail -->
    <g transform="translate(530, 30)" filter="url(#sh)">
        <rect width="100" height="50" rx="5" fill="#0A0F0C" stroke="#EF4444" stroke-width="1.5"/>
        <circle cx="20" cy="25" r="10" fill="#EF4444" opacity="0.15"/>
        <rect x="14" y="20" width="12" height="8" rx="1" fill="none" stroke="#EF4444" stroke-width="1.2"/>
        <path d="M 14 20 L 20 25 L 26 20" fill="none" stroke="#EF4444" stroke-width="0.8"/>
        <text x="38" y="22" fill="#F87171" font-family="monospace" font-size="9" font-weight="bold">GMAIL</text>
        <text x="38" y="34" fill="#475569" font-family="monospace" font-size="6">users.messages</text>
    </g>
    <path d="M 600 80 L 610 108" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5">
        <animate attributeName="stroke-dashoffset" values="8;0" dur="0.8s" repeatCount="indefinite"/>
    </path>

    <!-- Drive -->
    <g transform="translate(688, 70)" filter="url(#sh)">
        <rect width="100" height="50" rx="5" fill="#0A0F0C" stroke="#FBBF24" stroke-width="1.5"/>
        <polygon points="20,15 12,30 28,30" fill="none" stroke="#FBBF24" stroke-width="1.5"/>
        <text x="38" y="22" fill="#FDE68A" font-family="monospace" font-size="9" font-weight="bold">DRIVE</text>
        <text x="38" y="34" fill="#475569" font-family="monospace" font-size="6">files.list</text>
    </g>
    <path d="M 710 120 L 660 135" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5">
        <animate attributeName="stroke-dashoffset" values="8;0" dur="0.9s" repeatCount="indefinite"/>
    </path>

    <!-- Calendar -->
    <g transform="translate(700, 160)" filter="url(#sh)">
        <rect width="90" height="50" rx="5" fill="#0A0F0C" stroke="#38BDF8" stroke-width="1.5"/>
        <rect x="12" y="15" width="16" height="14" rx="1.5" fill="none" stroke="#38BDF8" stroke-width="1.2"/>
        <line x1="12" y1="20" x2="28" y2="20" stroke="#38BDF8" stroke-width="0.8"/>
        <line x1="16" y1="11" x2="16" y2="16" stroke="#38BDF8" stroke-width="1.2"/>
        <line x1="24" y1="11" x2="24" y2="16" stroke="#38BDF8" stroke-width="1.2"/>
        <text x="36" y="22" fill="#7DD3FC" font-family="monospace" font-size="9" font-weight="bold">CAL</text>
        <text x="36" y="34" fill="#475569" font-family="monospace" font-size="6">events.list</text>
    </g>
    <path d="M 700 185 L 662 155" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5">
        <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" repeatCount="indefinite"/>
    </path>

    <!-- Tasks -->
    <g transform="translate(688, 240)" filter="url(#sh)">
        <rect width="90" height="50" rx="5" fill="#0A0F0C" stroke="#A78BFA" stroke-width="1.5"/>
        <rect x="13" y="16" width="12" height="12" rx="2" fill="none" stroke="#A78BFA" stroke-width="1.2"/>
        <path d="M 16 22 L 19 25 L 24 18" fill="none" stroke="#A78BFA" stroke-width="1.5"/>
        <text x="34" y="22" fill="#C4B5FD" font-family="monospace" font-size="9" font-weight="bold">TASKS</text>
        <text x="34" y="34" fill="#475569" font-family="monospace" font-size="6">tasks.list</text>
    </g>
    <path d="M 700 240 L 650 175" fill="none" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5">
        <animate attributeName="stroke-dashoffset" values="8;0" dur="1.1s" repeatCount="indefinite"/>
    </path>

    <!-- ===== KEYRING NODE (below router) ===== -->
    <g transform="translate(595, 300)" filter="url(#sh)">
        <rect width="120" height="44" rx="5" fill="#0A0F0C" stroke="#6D28D9" stroke-width="1.5"/>
        <!-- Lock icon -->
        <rect x="14" y="18" width="12" height="10" rx="1" fill="none" stroke="#A78BFA" stroke-width="1.2"/>
        <path d="M 17 18 L 17 14 A 3 3 0 0 1 23 14 L 23 18" fill="none" stroke="#A78BFA" stroke-width="1.2"/>
        <circle cx="20" cy="23" r="1.5" fill="#A78BFA"/>
        <text x="34" y="22" fill="#A78BFA" font-family="monospace" font-size="8" font-weight="bold">OS KEYRING</text>
        <text x="34" y="34" fill="#475569" font-family="monospace" font-size="6">AES-256 · OAuth2</text>
    </g>
    <line x1="640" y1="300" x2="630" y2="215" stroke="#6D28D9" stroke-width="1" stroke-dasharray="3 5" opacity="0.3"/>

    <!-- ===== BOTTOM: How it works flow ===== -->
    <rect x="0" y="372" width="800" height="28" fill="#040D08" opacity="0.95"/>
    <line x1="0" y1="372" x2="800" y2="372" stroke="#1A3A2A" stroke-width="0.5"/>
    <g transform="translate(400, 387)" font-family="monospace" font-size="7" fill="#475569" text-anchor="middle" letter-spacing="1">
        <text><tspan fill="#34D399">STDIN</tspan> → <tspan fill="#A7F3D0">TOKENIZE</tspan> → <tspan fill="#34D399">LLM ROUTE</tspan> → <tspan fill="#FBBF24">GOOGLE API</tspan> → <tspan fill="#34D399">FORMAT</tspan> → <tspan fill="#FFF">STDOUT</tspan></text>
    </g>

</svg>
