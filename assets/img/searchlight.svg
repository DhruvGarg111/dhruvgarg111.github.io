<svg viewBox="0 0 800 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Deep Aerial/Radar Background -->
        <radialGradient id="radarAura" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#0F2B48" stop-opacity="0.9"/>
            <stop offset="60%" stop-color="#061A2E" stop-opacity="1"/>
            <stop offset="100%" stop-color="#020812" stop-opacity="1"/>
        </radialGradient>
        
        <pattern id="radarGrid" width="80" height="80" patternUnits="userSpaceOnUse" patternTransform="scale(0.8)">
            <circle cx="40" cy="40" r="40" fill="none" stroke="#38BDF8" stroke-width="0.3" stroke-opacity="0.15"/>
            <path d="M 0 40 L 80 40 M 40 0 L 40 80" stroke="#38BDF8" stroke-width="0.3" stroke-opacity="0.15"/>
        </pattern>
        
        <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#38BDF8" opacity="0.1"/>
        </pattern>

        <!-- Glass Planes -->
        <linearGradient id="glassLinear" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15"/>
            <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.03"/>
            <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1"/>
        </linearGradient>

        <linearGradient id="neonCyan" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#E0F2FE"/>
            <stop offset="50%" stop-color="#38BDF8"/>
            <stop offset="100%" stop-color="#0284C7"/>
        </linearGradient>

        <!-- Heatmap / Target Glows -->
        <radialGradient id="hotspot" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#EF4444" stop-opacity="0.95"/>
            <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="targetGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#EF4444" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
        </radialGradient>

        <!-- Filters -->
        <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>

        <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="15" result="blur2"/>
            <feGaussianBlur stdDeviation="5" result="blur1"/>
            <feMerge>
                <feMergeNode in="blur2"/>
                <feMergeNode in="blur1"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        
        <filter id="glowRed" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="6" result="blur1"/>
            <feMerge>
                <feMergeNode in="blur1"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <filter id="shadowHeavy" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="35" stdDeviation="30" flood-color="#000" flood-opacity="0.9"/>
            <feDropShadow dx="0" dy="15" stdDeviation="10" flood-color="#011F36" flood-opacity="0.8"/>
        </filter>

        <!-- Connecting Beams -->
        <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
            <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
        </linearGradient>
    </defs>

    <!-- Base Canvas -->
    <rect width="100%" height="100%" fill="url(#radarAura)"/>
    <rect width="100%" height="100%" fill="url(#radarGrid)"/>
    <rect width="100%" height="100%" fill="url(#dotGrid)"/>
    
    <!-- Sweeping Radar Line Background -->
    <path d="M 400 200 L 900 200 A 500 500 0 0 1 400 700 Z" fill="#38BDF8" opacity="0.04">
        <animateTransform attributeName="transform" type="rotate" from="0 400 200" to="360 400 200" dur="10s" repeatCount="indefinite"/>
    </path>

    <!-- Top Left Decor: Global Coordinate Tracking -->
    <g transform="translate(30, 30)">
        <path d="M 0 15 L 0 0 L 15 0" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.7"/>
        <text x="25" y="10" fill="#7DD3FC" font-family="monospace" font-size="10" letter-spacing="1">UAV_SYS // ACTIVE</text>
        <text x="25" y="25" fill="#0284C7" font-family="monospace" font-size="9" letter-spacing="1">LAT: 34.0522° N, LON: 118.2437° W</text>
    </g>

    <!-- Top Right Decor: System Load -->
    <g transform="translate(620, 30)">
        <path d="M 150 15 L 150 0 L 135 0" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.7"/>
        <text x="125" y="10" fill="#7DD3FC" font-family="monospace" font-size="10" letter-spacing="1" text-anchor="end">GPU ACCELERATION: ON</text>
        <text x="125" y="25" fill="#34D399" font-family="monospace" font-size="9" letter-spacing="1" text-anchor="end">COMPUTE SAVED: 92.4%</text>
    </g>

    <!-- Header Panel -->
    <g transform="translate(180, 20)" filter="url(#shadowHeavy)">
        <rect width="440" height="70" rx="10" fill="url(#glassLinear)" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.5" filter="url(#glassBlur)"/>
        <path d="M 0 10 C 0 4.5 4.5 0 10 0 L 430 0 C 435.5 0 440 4.5 440 10" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" filter="url(#glowCyan)"/>
        
        <text x="220" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="22" font-weight="900" letter-spacing="5" text-anchor="middle">THE SEARCHLIGHT PROTOCOL</text>
        <text x="220" y="52" fill="#BAE6FD" font-family="monospace" font-size="10" font-weight="600" letter-spacing="3" text-anchor="middle">AERIAL INTELLIGENCE SYSTEM</text>
    </g>

    <!-- Foreground Dense Telemetry Lines -->
    <path d="M 0 360 L 120 360 L 150 390 L 800 390" fill="none" stroke="#0284C7" stroke-width="1" opacity="0.4"/>
    <path d="M 0 340 L 60 340 L 80 360" fill="none" stroke="#0284C7" stroke-width="1" opacity="0.2"/>
    <text x="160" y="385" fill="#0284C7" font-family="monospace" font-size="9" letter-spacing="2">PIPELINE TRACE: GUIDE -> SLICE -> DETECT</text>

    <!-- ISOMETRIC COARSE-TO-FINE PIPELINE -->
    <!-- Increased scale from (1.2, 0.6) to (1.6, 0.8) to fill the screen better -->
    <g transform="translate(400, 220) scale(1.6, 0.8) rotate(-30)">
        
        <!-- The piercing beam -->
        <line x1="-350" y1="0" x2="350" y2="0" stroke="url(#beam)" stroke-width="10" filter="url(#glowCyan)"/>
        <line x1="-350" y1="0" x2="350" y2="0" stroke="#FFF" stroke-width="2.5" stroke-dasharray="25 50">
            <animate attributeName="stroke-dashoffset" values="75;0" dur="1s" repeatCount="indefinite"/>
        </line>
        
        <!-- PLANE 1: Raw High-Res Feed (Leftmost) -->
        <g transform="translate(-200, 0)">
            <rect x="-80" y="-80" width="160" height="160" fill="url(#glassLinear)" stroke="#0284C7" stroke-width="2.5" filter="url(#shadowHeavy)"/>
            <path d="M -80 0 L 80 0 M 0 -80 L 0 80" stroke="#0284C7" opacity="0.8" stroke-width="1.5"/>
            <path d="M -40 -80 L -40 80 M 40 -80 L 40 80 M -80 -40 L 80 -40 M -80 40 L 80 40" stroke="#38BDF8" opacity="0.2" stroke-width="1"/>
            <circle cx="0" cy="0" r="2.5" fill="#BAE6FD"/>
            <circle cx="30" cy="-40" r="2" fill="#BAE6FD"/>
            <circle cx="-50" cy="50" r="1.5" fill="#BAE6FD" opacity="0.5"/>
            <!-- Scanning reticle -->
            <rect x="-70" y="-70" width="140" height="140" fill="none" stroke="#fff" stroke-width="1" stroke-dasharray="10 20" opacity="0.3">
                <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
            </rect>
        </g>

        <!-- PLANE 2: LayerCAM Heatmap (Middle) -->
        <g transform="translate(0, 0)">
            <rect x="-80" y="-80" width="160" height="160" fill="url(#glassLinear)" stroke="#EF4444" stroke-width="2" filter="url(#shadowHeavy)"/>
            
            <rect x="-15" y="-75" width="90" height="70" fill="url(#hotspot)"/>
            <circle cx="30" cy="-40" r="5" fill="#FFF" filter="url(#glowRed)"/>
            
            <rect x="-35" y="-35" width="70" height="70" fill="url(#hotspot)"/>
            <circle cx="0" cy="0" r="7" fill="#FFF" filter="url(#glowRed)">
                <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite"/>
            </circle>
            
            <!-- Tracking corners -->
            <path d="M -75 -60 L -75 -75 L -60 -75 M 75 -60 L 75 -75 L 60 -75 M -75 60 L -75 75 L -60 75 M 75 60 L 75 75 L 60 75" fill="none" stroke="#EF4444" stroke-width="2" opacity="0.8"/>
        </g>

        <!-- PLANE 3: Active Crop / YOLO Fusion (Rightmost) -->
        <g transform="translate(200, 0)">
            <rect x="-60" y="-60" width="120" height="120" fill="url(#glassLinear)" stroke="#38BDF8" stroke-width="2.5" filter="url(#shadowHeavy)"/>
            
            <!-- Slice extracted -->
            <rect x="-25" y="-25" width="50" height="50" fill="url(#targetGlow)" stroke="#FBBF24" stroke-width="2" stroke-dasharray="5 5"/>
            
            <!-- Bounding Box -->
            <rect x="-12" y="-12" width="24" height="24" fill="none" stroke="#EF4444" stroke-width="2.5"/>
            <circle cx="0" cy="0" r="3.5" fill="#EF4444"/>
            <polygon points="-12,-12 -6,-18 12,-18 12,-12" fill="#EF4444"/>
            
            <!-- Final target lock reticle overlay -->
            <circle cx="0" cy="0" r="35" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="10 20">
                <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
            </circle>
            <circle cx="0" cy="0" r="5" fill="#FFF" filter="url(#glowCyan)"/>
        </g>
    </g>

    <!-- Technical Specs & Descriptions Background Boxes -->
    <!-- Left -->
    <g transform="translate(40, 260)" filter="url(#shadowHeavy)">
        <rect width="210" height="60" rx="6" fill="#020812" stroke="#0284C7" stroke-width="1" opacity="0.8"/>
        <text x="15" y="25" fill="#0284C7" font-family="monospace" font-size="12" font-weight="900" letter-spacing="2">STAGE 01</text>
        <text x="15" y="42" fill="#7DD3FC" font-family="monospace" font-size="9" letter-spacing="1">RAW 4K UAV FEED</text>
    </g>

    <!-- Middle -->
    <g transform="translate(290, 310)" filter="url(#shadowHeavy)">
        <rect width="220" height="60" rx="6" fill="#020812" stroke="#EF4444" stroke-width="1" opacity="0.8"/>
        <text x="110" y="25" fill="#EF4444" font-family="monospace" font-size="12" font-weight="900" letter-spacing="2" text-anchor="middle">STAGE 02 / GUIDE</text>
        <text x="110" y="42" fill="#FCA5A5" font-family="monospace" font-size="9" letter-spacing="1" text-anchor="middle">ResNet + LayerCAM</text>
    </g>

    <!-- Right -->
    <g transform="translate(550, 260)" filter="url(#shadowHeavy)">
        <rect width="210" height="60" rx="6" fill="#020812" stroke="#38BDF8" stroke-width="1" opacity="0.8"/>
        <text x="195" y="25" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="900" letter-spacing="2" text-anchor="end">STAGE 03 / SLICER</text>
        <text x="195" y="42" fill="#BAE6FD" font-family="monospace" font-size="9" letter-spacing="1" text-anchor="end">YOLOv8 GLOBAL FUSION</text>
    </g>

    <!-- Bottom Left Decor -->
    <g stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0.7">
        <path d="M 30 370 L 30 385 L 45 385"/>
    </g>
    <g stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0.7">
        <path d="M 770 370 L 770 385 L 755 385"/>
    </g>

</svg>
